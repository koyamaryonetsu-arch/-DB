<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05071a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="きずな">
<meta name="format-detection" content="telephone=no">
<title>きずなの紋章</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css?v=cb6fd0fb30e1">
</head>
<body>
<div id="app">
  <canvas id="field3d" aria-hidden="true" hidden></canvas>
  <canvas id="field" aria-label="フィールド"></canvas>
  <div id="labels"></div>
  <div id="fx"></div>
  <div id="hud" hidden></div>
  <div id="battle" hidden></div>
  <div id="ui"></div>
  <div id="touch" hidden>
    <div id="stick"><div id="stick-knob"></div></div>
    <button id="btn-a" class="tbtn" aria-label="決定・話す">A</button>
    <button id="btn-b" class="tbtn" aria-label="メニュー・もどる">B</button>
    <button id="btn-run" class="tbtn run" aria-label="走る（おすたびに切りかえ）"><span>走る</span></button>
  </div>
  <div id="toast"></div>
  <div id="curtain"></div>
</div>
<noscript>このゲームはJavaScriptが必要です。</noscript>
<script>
  // サイトの 版（タイトル画面に 出す）
  window.KIZUNA_VERSION = {"v":"cb6fd0fb30e1","date":"2026-09-26T14:54:22Z"};
  // 新しい 版に なった 直後など、読みこみに しっぱいしたら 1回だけ 読みこみ直す
  function kizunaBootFail() {
    try { if (sessionStorage.getItem('kizuna_reload')) return; sessionStorage.setItem('kizuna_reload', '1'); } catch (e) {}
    setTimeout(function () { location.reload(); }, 1500);
  }
</script>
<script type="module" src="js/main.js?v=cb6fd0fb30e1" onerror="kizunaBootFail()"></script>
</body>
</html>
