<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<title>写真台帳作成アプリ</title>
<style>
/* ========== 基本 ========== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",sans-serif;
  background:#eceff3; color:#111; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid #0b57d0; outline-offset:1px}

/* ========== ツールバー ========== */
.bar{
  position:sticky; top:0; z-index:50; background:#0b3d91; color:#fff;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.bar .title{font-weight:700; font-size:15px; margin-right:4px; white-space:nowrap}
.bar .spacer{flex:1}
.btn{
  appearance:none; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.10); color:#fff;
  padding:8px 10px; border-radius:8px; font-size:13px; cursor:pointer; white-space:nowrap; line-height:1.2;
  min-height:38px; display:inline-flex; align-items:center; gap:5px;
}
.btn:hover{background:rgba(255,255,255,.22)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#ffb703; border-color:#ffb703; color:#25200a; font-weight:700}
.btn.primary:hover{background:#ffc42e}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 7px; min-height:30px; font-size:12px}
.bar select,.bar input[type=text]{
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.35);
  border-radius:8px; padding:7px 8px; font-size:13px; min-height:38px; max-width:42vw;
}
.bar select option{color:#111}
.more,.more2{display:contents}
#btnMore{display:none}
@media screen and (max-width:820px){
  .bar{padding:5px 6px; gap:5px}
  .bar .title{font-size:14px}
  .btn{padding:6px 9px; font-size:12.5px; min-height:36px}
  .bar select{padding:6px; font-size:12.5px; min-height:36px; max-width:38vw}
  #btnMore{display:inline-flex}
  .more,.more2{
    display:none; position:absolute; top:100%; right:6px; z-index:60;
    background:#0b3d91; border:1px solid rgba(255,255,255,.35); border-radius:10px;
    padding:8px; flex-direction:column; gap:6px; box-shadow:0 10px 28px rgba(0,0,0,.35); min-width:200px;
  }
  .more.open,.more2.open{display:flex}
  .more .btn,.more2 .btn{justify-content:flex-start; width:100%}
  .more2{right:auto; left:6px}
}
.hint{font-size:12px; opacity:.85}

/* ========== 設定パネル ========== */
.panel{background:#fff; border-bottom:1px solid #d5dae2; padding:10px 12px; display:none}
.panel.open{display:block}
.panel h3{margin:0 0 8px; font-size:13px; color:#0b3d91; letter-spacing:.04em}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px 12px}
.fld{display:flex; flex-direction:column; gap:3px}
.fld label{font-size:11px; color:#5b6472; font-weight:600}
.fld input,.fld select,.fld textarea{
  border:1px solid #c6ccd6; border-radius:7px; padding:8px; font-size:14px; background:#fff; min-height:38px;
}
.fld .row{display:flex; gap:6px; align-items:center}
.chk{display:flex; align-items:center; gap:6px; font-size:13px; padding-top:14px}
.chk input{width:18px; height:18px}
.linked{color:#0b57d0; font-size:11px; font-weight:600}

/* ========== 一括操作バー ========== */
.selbar{
  position:sticky; top:52px; z-index:45; background:#123a6b; color:#fff; padding:8px 10px;
  display:none; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px;
}
.selbar.open{display:flex}
.selbar input[type=text]{background:#fff; color:#111; border:0; border-radius:7px; padding:7px 8px; font-size:13px; min-height:36px}

/* ========== ページ表示領域 ========== */
.wrap{padding:14px 8px 120px; display:flex; flex-direction:column; align-items:center; gap:14px; overflow-x:auto}
.pages{display:flex; flex-direction:column; align-items:center; gap:14px}
.sheetbox{position:relative}
.pagetools{
  display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:2px 0 0;
}
.pagetools .btn{background:#fff; color:#22303f; border:1px solid #c6ccd6}
.pagetools .btn:hover{background:#eef2f8}
.pagelabel{font-size:12px; color:#5b6472; font-weight:700; align-self:center; margin-right:4px}

/* ========== 用紙（A4）========== */
.sheet{
  width:210mm; min-height:297mm; background:#fff; padding:5mm 3mm 4mm;
  display:flex; flex-direction:column; box-shadow:0 2px 12px rgba(20,30,50,.18);
  position:relative; color:#000;
}
.sheet-head{font-size:11pt; line-height:1.2; padding:0 0 1.5mm 1mm; min-height:7mm}
.tbl{border:0.3mm solid #000; border-bottom:0}
.prow{display:flex; height:var(--rowh,86.4mm); border-bottom:0.3mm solid #000; position:relative; overflow:hidden}
.cell-photo{
  width:121.3mm; flex:0 0 121.3mm; border-right:0.3mm solid #000; padding:3mm;
  display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
}
.cell-photo img{max-width:100%; max-height:100%; object-fit:contain; display:block}
.cell-text{flex:1; padding:3mm 2.6mm; font-size:10.4pt; line-height:1.35; overflow:hidden; display:flex; flex-direction:column}
.f{min-height:4mm; margin-bottom:7.2mm; white-space:pre-wrap; word-break:break-word}
.f-site{font-weight:700; margin-bottom:1.8mm}
.rule{border-bottom:0.25mm solid #000; margin:0 0 2.6mm}
.f-note{margin-bottom:0; flex:1; line-height:1.55}
.sheet-foot{margin-top:auto; text-align:center; font-size:9.3pt; padding-top:2mm}

/* 表紙 */
.cover{display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 12mm}
.cover .c-sp1{height:62mm}
.cover .c-title{font-size:21.7pt; font-weight:700; line-height:1.85}
.cover .c-date{font-size:13pt; margin-top:52mm}
.cover .c-logo{margin-top:14mm; height:22mm; display:flex; align-items:center; justify-content:center}
.cover .c-logo img{max-height:22mm; max-width:80mm; object-fit:contain}
.cover .c-comp{font-size:21.7pt; font-weight:700; margin-top:10mm}
.cover .c-addr{font-size:13pt; margin-top:6mm}
.cover .c-tel{font-size:13pt; margin-top:6mm}

/* ========== 編集UI（画面のみ）========== */
[contenteditable]{outline:none}
.ed{border-radius:3px; transition:background .12s}
body.editing .ed:hover{background:#eaf1ff}
body.editing .ed:focus{background:#dfeaff; box-shadow:0 0 0 1px #0b57d0}
.ed:empty::before{content:attr(data-ph); color:#9aa4b2}
body:not(.editing) .ed:empty::before{content:""}

.rowtools{
  position:absolute; top:2px; left:30px; display:none; gap:3px; z-index:6; flex-wrap:wrap; max-width:118mm;
  background:rgba(255,255,255,.94); border:1px solid #c6ccd6; border-radius:8px; padding:2px;
}
body.editing .prow:hover .rowtools, body.editing .prow:focus-within .rowtools{display:flex}
body.editing .rowtools.always{display:flex}
.rowtools .btn{background:#fff; color:#22303f; border:1px solid #d7dce4; padding:3px 6px; min-height:26px; font-size:12px}
.rowtools .btn:hover{background:#eef2f8}
.rowtools .btn.danger{color:#b3261e}
.rowsel{position:absolute; top:4px; left:4px; z-index:6; width:20px; height:20px; display:none}
body.editing .rowsel{display:block}
.prow.selected{box-shadow:inset 0 0 0 2px #0b57d0}

.drop{
  position:absolute; inset:0; border:0.6mm dashed #b9c2cf; margin:2mm; border-radius:2mm;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:#7c8697; font-size:12px; cursor:pointer; background:#fbfcfe; text-align:center; padding:6px;
}
body:not(.editing) .drop{display:none}
.drop b{font-size:13px; color:#0b57d0}
.cell-photo.dragover{background:#e3efff}
.phototools{
  position:absolute; left:3mm; bottom:3mm; display:none; gap:4px; z-index:6;
  background:rgba(255,255,255,.94); border:1px solid #c6ccd6; border-radius:8px; padding:2px;
}
body.editing .cell-photo:hover .phototools{display:flex}
.phototools .btn{background:#fff; color:#22303f; border:1px solid #d7dce4; padding:3px 6px; min-height:26px; font-size:12px}

/* ========== モーダル ========== */
.mask{position:fixed; inset:0; background:rgba(15,22,35,.55); display:none; z-index:100; padding:16px; overflow:auto}
.mask.open{display:flex; align-items:flex-start; justify-content:center}
.modal{background:#fff; border-radius:14px; padding:16px; width:min(680px,100%); margin:24px 0; box-shadow:0 18px 48px rgba(0,0,0,.35)}
.modal h2{margin:0 0 4px; font-size:17px; color:#0b3d91}
.modal p{font-size:13px; color:#4b5563; line-height:1.7}
.modal textarea{width:100%; min-height:170px; border:1px solid #c6ccd6; border-radius:8px; padding:10px; font-size:13px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.modal .acts{display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap}
.modal .btn{background:#0b3d91; border-color:#0b3d91}
.modal .btn.ghost{background:#fff; color:#22303f; border:1px solid #c6ccd6}
.modal ul{font-size:13px; line-height:1.9; padding-left:1.2em; color:#333}
.modal kbd{background:#eef1f6; border:1px solid #c9d0da; border-bottom-width:2px; border-radius:4px; padding:1px 5px; font-size:12px}

.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
  background:#111a2b; color:#fff; padding:11px 18px; border-radius:24px; font-size:13px; z-index:200;
  opacity:0; pointer-events:none; transition:.22s; max-width:92vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.busy{position:fixed; inset:0; background:rgba(255,255,255,.75); z-index:150; display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; font-size:14px; color:#0b3d91; font-weight:700}
.busy.open{display:flex}
.spin{width:34px; height:34px; border:4px solid #cfd8e6; border-top-color:#0b3d91; border-radius:50%; animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ========== スマホ：カード表示 ========== */
@media screen{
  body.view-cards .wrap{padding:10px 8px 140px}
  body.view-cards .sheet{
    width:100%; max-width:620px; min-height:0; padding:0; background:transparent; box-shadow:none;
  }
  body.view-cards .sheet-head{
    font-size:13px; font-weight:700; color:#0b3d91; background:#dde6f5; border-radius:8px;
    padding:7px 10px; margin-bottom:8px; min-height:0;
  }
  body.view-cards .tbl{border:0}
  body.view-cards .prow{
    display:block; height:auto; border:1px solid #d5dae2; border-radius:12px; background:#fff;
    margin-bottom:10px; padding:8px 8px 10px; box-shadow:0 1px 4px rgba(20,30,50,.08); overflow:visible;
  }
  body.view-cards .cell-photo{
    width:100%; flex:none; border:0; padding:0; height:52vw; max-height:300px; background:#f4f6fa; border-radius:8px;
  }
  body.view-cards .cell-text{padding:10px 2px 0; font-size:15px}
  body.view-cards .f{margin-bottom:0; padding:7px 6px; border-bottom:1px dashed #dfe4ec; min-height:0}
  body.view-cards .f-site{font-size:15px}
  body.view-cards .rule{display:none}
  body.view-cards .f-note{min-height:44px; border-bottom:0}
  body.view-cards .sheet-foot{
    font-size:12px; color:#5b6472; padding:0 0 4px; text-align:center;
  }
  body.view-cards .rowtools{display:flex; position:static; margin:8px 0 0; justify-content:flex-end; background:transparent; border:0; padding:0; flex-wrap:wrap}
  body.view-cards .rowsel{position:static; margin-bottom:6px}
  body.view-cards .phototools{display:flex; left:6px; bottom:6px}
  body.view-cards .cover{padding:16px; background:#fff; border-radius:12px; border:1px solid #d5dae2}
  body.view-cards .cover .c-sp1{height:8mm}
  body.view-cards .cover .c-title{font-size:19px}
  body.view-cards .cover .c-date{margin-top:16px; font-size:14px}
  body.view-cards .cover .c-logo{margin-top:14px}
  body.view-cards .cover .c-comp{font-size:19px; margin-top:12px}
  body.view-cards .cover .c-addr,body.view-cards .cover .c-tel{font-size:13px; margin-top:6px}
  body.view-cards .fieldlabel{display:inline-block}
}
.fieldlabel{display:none; font-size:11px; color:#7c8697; font-weight:700; margin-right:6px; min-width:4.5em}

/* ========== 印刷 ========== */
@page{size:A4 portrait; margin:0}
@media print{
  body{background:#fff}
  .bar,.panel,.selbar,.pagetools,.rowtools,.rowsel,.phototools,.drop,.toast,.mask,.busy,.fieldlabel{display:none !important}
  .wrap{padding:0; gap:0; display:block}
  .pages{display:block; zoom:1 !important; transform:none !important; width:auto !important; margin-bottom:0 !important}
  .sheetbox{margin:0}
  .sheet{
    width:210mm; min-height:297mm; height:297mm; box-shadow:none; margin:0;
    page-break-after:always; break-after:page;
  }
  .sheetbox:last-child .sheet{page-break-after:auto; break-after:auto}
  .ed:empty::before{content:""}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>
</head>
<body class="editing">

<div class="bar">
  <span class="title">📷 写真台帳</span>
  <select id="projSel" title="台帳を切り替え"></select>
  <button class="btn sm ghost" id="btnNewProj" title="新しい台帳">＋新規</button>
  <div class="more2" id="more2">
    <button class="btn sm ghost" id="btnDupProj" title="この台帳を複製">⧉ 台帳を複製</button>
    <button class="btn sm ghost" id="btnDelProj" title="この台帳を削除">🗑 台帳を削除</button>
  </div>
  <span class="spacer"></span>
  <button class="btn primary" id="btnAddPhotos">🖼 写真をまとめて追加</button>
  <button class="btn" id="btnAddPage">＋ページ</button>
  <button class="btn" id="btnSettings">⚙ 共通設定</button>
  <button class="btn primary" id="btnPrint">🖨 印刷/PDF</button>
  <button class="btn" id="btnMore">⋯ その他</button>
  <div class="more" id="more">
    <button class="btn" id="btnCamera">📸 その場で撮影</button>
    <button class="btn" id="btnPaste">📋 まとめて貼り付け</button>
    <button class="btn" id="btnCopyAll">⧉ 全文コピー</button>
    <button class="btn" id="btnUndo" title="元に戻す (Ctrl+Z)">↩︎ 元に戻す</button>
    <button class="btn" id="btnSelAll">☑ 全部の写真を選択</button>
    <button class="btn" id="btnView">📱／🖨 表示切替</button>
    <button class="btn" id="btnHelp">? 使い方</button>
  </div>
</div>

<div class="panel" id="panel">
  <h3>共通項目（ここを直すと 表紙・全ページのヘッダー・全写真の欄が自動で書き換わります）<span class="linked">🔗 自動反映</span></h3>
  <div class="grid">
    <div class="fld"><label>台帳の名前（アプリ内の管理用）</label><input type="text" id="in_name"></div>
    <div class="fld"><label>物件名 🔗</label><input type="text" id="in_siteName" placeholder="TOHOシネマズ西新井"></div>
    <div class="fld"><label>工事名 🔗</label><input type="text" id="in_workName" placeholder="コンセッション環境改善工事"></div>
    <div class="fld"><label>日付（表紙）</label><input type="text" id="in_date" placeholder="2026/08/10"></div>
    <div class="fld"><label>会社名（表紙）</label><input type="text" id="in_company"></div>
    <div class="fld"><label>住所（表紙）</label><input type="text" id="in_address"></div>
    <div class="fld"><label>電話番号（表紙）</label><input type="text" id="in_tel"></div>
    <div class="fld"><label>1ページあたりの写真枚数</label>
      <select id="in_rpp"><option value="1">1枚</option><option value="2">2枚</option><option value="3" selected>3枚</option><option value="4">4枚</option></select>
    </div>
    <div class="fld"><label>ヘッダー文字（空欄なら「物件名　工事名」）</label><input type="text" id="in_header" placeholder="（自動）"></div>
    <div class="fld"><label>フッター書式（{n}=ページ番号 {t}=総ページ数）</label><input type="text" id="in_footer" placeholder="{n}/{t}ページ"></div>
    <div class="chk"><input type="checkbox" id="in_cover"><label for="in_cover">表紙をつける</label></div>
    <div class="chk"><input type="checkbox" id="in_inheritStage"><label for="in_inheritStage">新しい行に前の行の「工事区分」を引き継ぐ</label></div>
    <div class="chk"><input type="checkbox" id="in_inheritPlace"><label for="in_inheritPlace">新しい行に前の行の「撮影箇所」を引き継ぐ</label></div>
    <div class="fld"><label>表紙のロゴ</label>
      <div class="row">
        <button class="btn sm" id="btnLogo" style="background:#0b3d91">画像を選ぶ</button>
        <button class="btn sm ghost" id="btnLogoDef" style="color:#22303f;border-color:#c6ccd6">既定に戻す</button>
        <button class="btn sm ghost" id="btnLogoDel" style="color:#b3261e;border-color:#e6c3c0">消す</button>
      </div>
    </div>
    <div class="fld"><label>写真の並び順（まとめて追加するとき）</label>
      <select id="in_sort"><option value="name">ファイル名順</option><option value="taken">撮影日時順（Exif）</option><option value="pick">選んだ順</option></select>
    </div>
    <div class="fld"><label>写真の保存サイズ（長辺px・小さいほど軽い）</label>
      <select id="in_maxpx"><option value="1200">1200px</option><option value="1600" selected>1600px</option><option value="2000">2000px</option><option value="2600">2600px</option></select>
    </div>
    <div class="fld"><label>画面の表示倍率</label>
      <select id="in_zoom"><option value="fit">用紙を画面幅に合わせる</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select>
    </div>
    <div class="fld"><label>この台帳</label>
      <div class="row">
        <button class="btn sm" id="btnDupProj2" style="background:#0b3d91">複製する</button>
        <button class="btn sm ghost" id="btnDelProj2" style="color:#b3261e;border-color:#e6c3c0">削除する</button>
      </div>
    </div>
    <div class="fld"><label>データ</label>
      <div class="row">
        <button class="btn sm" id="btnExport" style="background:#0b3d91">書き出し(.json)</button>
        <button class="btn sm" id="btnImport" style="background:#0b3d91">読み込み</button>
      </div>
    </div>
  </div>
</div>

<div class="selbar" id="selbar">
  <b id="selcount">0枚選択中</b>
  <input type="text" id="selStage" placeholder="工事区分を一括入力" list="dl_stage">
  <input type="text" id="selPlace" placeholder="撮影箇所を一括入力" list="dl_place">
  <button class="btn sm" id="selApply">選択行に反映</button>
  <button class="btn sm" id="selPhotos">🖼 選択行に写真を入れる</button>
  <button class="btn sm" id="selClearPhoto">写真を外す</button>
  <button class="btn sm" id="selDelete" style="border-color:#ffb3ad;color:#ffd6d3">選択行を削除</button>
  <span class="spacer"></span>
  <button class="btn sm ghost" id="selAll">全選択</button>
  <button class="btn sm ghost" id="selNone">選択解除</button>
</div>

<datalist id="dl_stage"></datalist>
<datalist id="dl_place"></datalist>

<div class="wrap"><div class="pages" id="pages"></div></div>

<input type="file" id="fileMulti" accept="image/*" multiple hidden>
<input type="file" id="fileOne" accept="image/*" hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileLogo" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>

<div class="mask" id="mask">
  <div class="modal" id="modal"></div>
</div>
<div class="busy" id="busy"><div class="spin"></div><div id="busyTxt">処理中…</div></div>
<div class="toast" id="toast"></div>

const MM = 96/25.4;                 // 1mm = 3.7795px

const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));

const DEFAULT_META = {
  siteName:'', workName:'', date:'', company:'菱熱工業株式会社',
  address:'東京都品川区北品川6-7-29 ガーデンシティ品川御殿山', tel:'03-6456-4201',

  sort:'name', maxpx:1600, inheritStage:true, inheritPlace:false
};

/* ---------- IndexedDB（使えない環境ではメモリに退避） ---------- */
const MEM = {projects:new Map(), photos:new Map()};
let dbFail = false;
function idb(){
  return new Promise((res,rej)=>{
    if(dbFail || !window.indexedDB) return rej(new Error('no-idb'));
    const r = indexedDB.open('photo-ledger', 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'});
      if(!db.objectStoreNames.contains('photos'))   db.createObjectStore('photos');
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => { dbFail = true; rej(r.error); };
  });
}
async function dbPut(store, val, key){
  try{
    const db = await idb();
    await new Promise((res,rej)=>{ const t=db.transaction(store,'readwrite');
      t.objectStore(store).put(val, key); t.oncomplete=res; t.onerror=()=>rej(t.error); });
  }catch(e){ MEM[store].set(key!==undefined?key:val.id, val); }
}
async function dbGet(store, key){
  try{
    const db = await idb();
    return await new Promise((res,rej)=>{ const t=db.transaction(store,'readonly');
      const q=t.objectStore(store).get(key); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  }catch(e){ return MEM[store].get(key); }
}
async function dbDel(store, key){
  try{
    const db = await idb();
    await new Promise((res,rej)=>{ const t=db.transaction(store,'readwrite');
      t.objectStore(store).delete(key); t.oncomplete=res; t.onerror=()=>rej(t.error); });
  }catch(e){ MEM[store].delete(key); }
}
async function dbAll(store){
  try{
    const db = await idb();
    return await new Promise((res,rej)=>{ const t=db.transaction(store,'readonly');
      const q=t.objectStore(store).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
  }catch(e){ return Array.from(MEM[store].values()); }
}

let DOC = null;            // 現在の台帳
let LIST = [];             // 台帳一覧 [{id,name,updatedAt}]
let rowClip = null;        // 行コピー用の内部クリップボード
let lastRow = 0;           // 直近に触った行
const urlCache = new Map();
const undoStack = [];

function emptyRow(){ return {id:uid(), photo:null, stage:'', place:'', note:'', taken:0}; }
function newDoc(name){
  return {id:uid(), name:name||'新しい写真台帳', meta:Object.assign({},DEFAULT_META,{date:todayStr()}),
          rows:[emptyRow(),emptyRow(),emptyRow()], updatedAt:Date.now()};
}
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate());
}
const rpp = () => Math.max(1, Math.min(4, +DOC.meta.rowsPerPage || 3));

let saveTimer = null;

function pushUndo(){
  undoStack.push(JSON.stringify({meta:DOC.meta, rows:DOC.rows, name:DOC.name}));

function undo(){
  if(!undoStack.length) return toast('元に戻せる操作がありません');

/* ---------- 画像 ---------- */
function photoURL(id){
  if(!id) return null;
  if(urlCache.has(id)) return urlCache.get(id);
  return null;
}
async function loadPhotoURL(id){
  if(!id) return null;
  if(urlCache.has(id)) return urlCache.get(id);
  const blob = await dbGet('photos', id);
  if(!blob) return null;
  const url = URL.createObjectURL(blob);
  urlCache.set(id, url);
  return url;
}
async function shrink(file, maxpx){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){ bmp = await createImageBitmap(file); }
  let w = bmp.width, h = bmp.height;
  const s = Math.min(1, maxpx/Math.max(w,h));
  w = Math.max(1,Math.round(w*s)); h = Math.max(1,Math.round(h*s));
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  ctx.drawImage(bmp,0,0,w,h);
  if(bmp.close) bmp.close();
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
}
async function rotatePhoto(id){
  const blob = await dbGet('photos', id);
  if(!blob) return;
  const bmp = await createImageBitmap(blob);
  const c = document.createElement('canvas'); c.width=bmp.height; c.height=bmp.width;
  const x = c.getContext('2d');
  x.translate(c.width/2, c.height/2); x.rotate(Math.PI/2);
  x.drawImage(bmp, -bmp.width/2, -bmp.height/2);
  if(bmp.close) bmp.close();
  const out = await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));
  await dbPut('photos', out, id);
  const old = urlCache.get(id); if(old) URL.revokeObjectURL(old);
  urlCache.delete(id);
}
/* Exif の撮影日時（JPEGのみ・失敗したら0） */
async function exifTaken(file){
  try{
    const buf = await file.slice(0, 256*1024).arrayBuffer();
    const v = new DataView(buf);
    if(v.getUint16(0) !== 0xFFD8) return 0;
    let off = 2;
    while(off < v.byteLength-4){
      if(v.getUint8(off) !== 0xFF) break;
      const marker = v.getUint8(off+1), size = v.getUint16(off+2);
      if(marker === 0xE1){
        const start = off+4;
        if(v.getUint32(start) !== 0x45786966) return 0;      // "Exif"
        const t = start+6;
        const le = v.getUint16(t) === 0x4949;
        const g16 = p => v.getUint16(p, le), g32 = p => v.getUint32(p, le);
        let ifd = t + g32(t+4);
        const readIFD = (p, tag) => {
          const n = g16(p);
          for(let i=0;i<n;i++){
            const e = p+2+i*12;
            if(g16(e) === tag) return {type:g16(e+2), cnt:g32(e+4), val:g32(e+8), ent:e};
          }
          return null;
        };
        const exifPtr = readIFD(ifd, 0x8769);
        if(exifPtr){
          const d = readIFD(t + exifPtr.val, 0x9003);
          if(d){
            let p = d.cnt > 4 ? t + d.val : d.ent + 8;
            let s = '';
            for(let i=0;i<19;i++) s += String.fromCharCode(v.getUint8(p+i));
            const m = s.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
            if(m) return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();
          }
        }
        return 0;
      }
      if(marker === 0xDA) break;
      off += 2 + size;
    }
  }catch(e){}
  return 0;
}

function moveRow(i, d){

  DOC.rows.splice(j,0,r);
  render(); save();
}

const CAN_ZOOM = !!(window.CSS && CSS.supports && CSS.supports('zoom','0.5'));
function setScale(pages, z){
  if(z === 1){ clearScale(pages); return; }
  if(CAN_ZOOM){ pages.style.zoom = z; return; }
  pages.style.transformOrigin = 'top left';
  pages.style.transform = 'scale(' + z + ')';
  pages.style.width = (100/z) + '%';
  pages.style.marginBottom = (-(pages.offsetHeight * (1-z))) + 'px';

  pages.style.zoom = ''; pages.style.transform = ''; pages.style.width = ''; pages.style.marginBottom = '';

}

  const items = e.clipboardData ? Array.from(e.clipboardData.items||[]) : [];
  const imgs = items.filter(it => it.kind === 'file' && it.type.startsWith('image/'))
                    .map(it => it.getAsFile()).filter(Boolean);

/* ---------- 写真の追加 ---------- */
function firstEmptyIndex(){
  const i = DOC.rows.findIndex(r => !r.photo);
  return i < 0 ? DOC.rows.length : i;
}
function pickMulti(startIndex){ $('#fileMulti')._at = startIndex; $('#fileMulti').click(); }
function pickOne(index){ $('#fileOne')._at = index; $('#fileOne').click(); }

async function sortFiles(files){
  const mode = DOC.meta.sort || 'name';
  const arr = files.slice();
  if(mode === 'pick') return arr;
  if(mode === 'name'){
    const col = new Intl.Collator('ja', {numeric:true, sensitivity:'base'});
    return arr.sort((a,b) => col.compare(a.name, b.name));
  }
  const withT = [];
  for(const f of arr) withT.push({f, t: (await exifTaken(f)) || f.lastModified || 0});
  withT.sort((a,b) => a.t - b.t);
  return withT.map(x => x.f);
}

async function addPhotos(files, startIndex, targets){
  files = Array.from(files).filter(f => f.type.startsWith('image/'));
  if(!files.length) return;
  pushUndo();
  busy(true, '写真を読み込み中… (0/'+files.length+')');
  const sorted = await sortFiles(files);
  const maxpx = +DOC.meta.maxpx || 1600;
  let ti = 0;
  let cursor = (startIndex == null ? firstEmptyIndex() : Math.max(0, startIndex));

  for(let k=0; k<sorted.length; k++){
    busy(true, '写真を読み込み中… ('+(k+1)+'/'+sorted.length+')');
    let idx;
    if(targets && targets.length){
      idx = (ti < targets.length) ? targets[ti++] : null;
      if(idx == null){ DOC.rows.push(newInheritRow()); idx = DOC.rows.length-1; }
    }else{
      while(cursor < DOC.rows.length && DOC.rows[cursor].photo) cursor++;
      if(cursor >= DOC.rows.length){ DOC.rows.push(newInheritRow()); }
      idx = cursor; cursor++;
    }
    try{
      const blob = await shrink(sorted[k], maxpx);
      const id = uid();
      await dbPut('photos', blob, id);
      const r = DOC.rows[idx];
      const old = r.photo;
      r.photo = id;
      r.taken = (await exifTaken(sorted[k])) || sorted[k].lastModified || 0;
      if(old && urlCache.has(old)){ URL.revokeObjectURL(urlCache.get(old)); urlCache.delete(old); }
    }catch(err){ console.error(err); toast('読み込めない画像がありました: '+sorted[k].name); }
  }
  padToFullPage();
  busy(false);
  render(); save();
  toast(sorted.length + '枚の写真を入れました');
}
function newInheritRow(){
  const r = emptyRow();
  const last = DOC.rows[DOC.rows.length-1];
  if(last){
    if(DOC.meta.inheritStage) r.stage = last.stage || '';
    if(DOC.meta.inheritPlace) r.place = last.place || '';
  }
  return r;
}
function padToFullPage(){
  const n = rpp();
  while(DOC.rows.length % n !== 0) DOC.rows.push(newInheritRow());
}

    if(opt && opt.rerender) render(); else syncBound(key, null);

  });
}

    closeModal(); render(); save(); toast(lines.length + '行に反映しました');

};

   ============================================================ */
function blobToDataURL(b){
  return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });
}
function dataURLtoBlob(u){
  const [h, d] = u.split(',');
  const mime = (h.match(/:(.*?);/) || [,'image/jpeg'])[1];
  const bin = atob(d);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
$('#btnExport').onclick = async () => {
  busy(true, '書き出し中…');
  const out = {app:'photo-ledger', ver:1, name:DOC.name, meta:DOC.meta, rows:[]};
  for(const r of DOC.rows){
    const o = {stage:r.stage, place:r.place, note:r.note, taken:r.taken, img:null};
    if(r.photo){ const b = await dbGet('photos', r.photo); if(b) o.img = await blobToDataURL(b); }
    out.rows.push(o);
  }
  const blob = new Blob([JSON.stringify(out)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (DOC.name || '写真台帳').replace(/[\\/:*?"<>|]/g,'_') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  busy(false);
  toast('書き出しました（写真も入っています）');
};

$('#fileJson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  busy(true, '読み込み中…');
  try{
    const data = JSON.parse(await f.text());
    if(data.app !== 'photo-ledger') throw new Error('形式が違います');
    await save(true);
    const d = newDoc(data.name || '読み込んだ台帳');
    d.meta = Object.assign({}, DEFAULT_META, data.meta || {});
    d.rows = [];
    for(const r of (data.rows || [])){
      const nr = emptyRow();
      nr.stage = r.stage||''; nr.place = r.place||''; nr.note = r.note||''; nr.taken = r.taken||0;
      if(r.img){ const id = uid(); await dbPut('photos', dataURLtoBlob(r.img), id); nr.photo = id; }
      d.rows.push(nr);
    }
    if(!d.rows.length) d.rows = [emptyRow(),emptyRow(),emptyRow()];
    DOC = d; urlCache.clear(); undoStack.length = 0;
    await save(true); fillPanel(); render();
    toast('読み込みました');
  }catch(err){ alert('読み込めませんでした：' + err.message); }
  busy(false);
});

/* ============================================================
   起動
   ============================================================ */
(async function init(){
  try{
    const all = await dbAll('projects');
    LIST = all.map(p => ({id:p.id, name:p.name, updatedAt:p.updatedAt||0}));
    let last = null;
    try{ last = localStorage.getItem('pl.last'); }catch(e){}
    const pick = (last && all.find(p=>p.id===last)) || all.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
    if(pick){ DOC = pick; DOC.meta = Object.assign({}, DEFAULT_META, DOC.meta); DOC.rows.forEach(r=>r.sel=false); }
    else { DOC = newDoc('写真台帳 ' + todayStr()); await save(true); }
  }catch(e){
    console.error(e);
    DOC = newDoc('写真台帳 ' + todayStr());
    toast('この環境では自動保存が使えません。⚙の「書き出し(.json)」でバックアップしてください', 6000);
  }
  let view = null;
  try{ view = localStorage.getItem('pl.view'); }catch(e){}
  setView(view ? view === 'cards' : window.innerWidth < 1000);
  try{ const z = localStorage.getItem('pl.zoom'); if(z && !DOC.meta.zoom) DOC.meta.zoom = z; }catch(e){}
  fillPanel();
  renderProjectSelect();
  render();
  if(!DOC.meta.siteName && !DOC.meta.workName) $('#panel').classList.add('open');
})();
