# きずなの紋章: 「ひとりで遊ぶサイト」を GitHub Pages に おく
# 公開先: https://koyamaryonetsu-arch.github.io/-DB/kizuna/
# gh-pages ブランチの kizuna/ フォルダだけを 入れかえる（ほかの フォルダ・ほかの ゲームは そのまま）
# family-rpg を かえて push すると、テストを してから 自動で サイトが 新しくなる
name: kizuna-site

on:
  push:
    branches: [claude/elegant-bell-al2f1w]
    paths:
      - 'family-rpg/**'
      - '.github/workflows/kizuna-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kizuna-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: family-rpg
        run: npm test
      - name: Build site
        run: node family-rpg/tools/build-site.mjs _site "$GITHUB_SHA" "$(git log -1 --format=%cI)"
      - name: Deploy to gh-pages/kizuna
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            rm -rf pages
            if git ls-remote --exit-code --heads "$REPO" gh-pages > /dev/null; then
              git clone --depth 1 --branch gh-pages "$REPO" pages
            else
              git init -b gh-pages pages
            fi
            rm -rf pages/kizuna
            cp -r _site pages/kizuna
            touch pages/.nojekyll
            git -C pages add -A
            if git -C pages diff --cached --quiet; then echo "no changes"; exit 0; fi
            git -C pages commit -q -m "kizuna: ${GITHUB_SHA::7}"
            if git -C pages push "$REPO" HEAD:gh-pages; then exit 0; fi
            sleep 5
          done
          exit 1
