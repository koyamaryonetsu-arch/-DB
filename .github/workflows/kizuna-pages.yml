# きずなの紋章: 「ひとりで遊ぶサイト」を GitHub Pages に おく
# family-rpg を かえて push すると、テストを してから 自動で サイトが 新しくなる
name: kizuna-site

on:
  push:
    branches: [claude/elegant-bell-al2f1w]
    paths:
      - 'family-rpg/**'
      - '.github/workflows/kizuna-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kizuna-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: family-rpg
        run: npm test
      - name: Build site
        run: node family-rpg/tools/build-site.mjs _site "$GITHUB_SHA" "$(git log -1 --format=%cI)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
