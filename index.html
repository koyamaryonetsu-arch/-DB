<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シネマ案件管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>シネマ案件管理</h1>
    <p class="login-subtitle">ログイン</p>
    <form id="loginForm">
      <label for="loginEmail">メールアドレス</label>
      <input type="email" id="loginEmail" required autocomplete="username" placeholder="例: name@ryonetsu.com">
      <label for="loginPassword">パスワード</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
      <div id="loginError" class="login-error hidden"></div>
      <button type="submit" class="primary">ログイン</button>
      <p class="login-hint">※ パスワードはメールアドレスの@より前の部分（小文字）です</p>
    </form>
  </div>
</div>

<div id="appShell" class="hidden">
  <header>
    <h1 id="appTitle">TOHOシネマズ 案件管理</h1>
    <div class="header-actions">
      <input type="search" id="searchBox" placeholder="検索（劇場名・担当者・内容・種別など）">
      <select id="companyFilter" class="hidden">
        <option value="">全会社</option>
        <option value="TOHOシネマズ">TOHOシネマズ</option>
        <option value="109シネマズ">109シネマズ</option>
        <option value="ユナイテッドシネマ">ユナイテッドシネマ</option>
        <option value="佐々木興業">佐々木興業</option>
      </select>
      <select id="statusFilter">
        <option value="">全ステータス</option>
        <option value="受付">受付</option>
        <option value="調査中">調査中</option>
        <option value="見積り提出済">見積り提出済</option>
        <option value="作業中">作業中</option>
        <option value="完了">完了</option>
        <option value="保留">保留</option>
        <option value="請求済">請求済</option>
        <option value="入金済">入金済</option>
      </select>
      <button id="newCaseBtn" class="primary">＋ 新規案件登録</button>
      <button id="exportBtn">Excelダウンロード</button>
      <span class="user-info">
        <span id="userEmail"></span>
        <button id="logoutBtn" class="link-btn">ログアウト</button>
      </span>
    </div>
  </header>

  <main>
    <div class="legend">
      <span class="legend-item"><span class="swatch swatch-yellow"></span>受付→調査が3日以上</span>
      <span class="legend-item"><span class="swatch swatch-red"></span>調査→見積りが3日以上</span>
      <span id="caseCount" class="case-count"></span>
    </div>

    <div class="table-wrap">
      <table id="casesTable">
        <thead>
          <tr>
            <th class="col-company">会社</th>
            <th>受付日</th>
            <th>劇場名</th>
            <th>TC担当者</th>
            <th>R担当者</th>
            <th>調査日</th>
            <th>見積り提出日</th>
            <th>種別</th>
            <th>内容</th>
            <th>ステータス</th>
            <th>作業開始日</th>
            <th>作業完了日</th>
            <th>請求書発行</th>
            <th>入金</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="casesBody"></tbody>
      </table>
      <p id="emptyMsg" class="empty-msg">まだ案件が登録されていません。「＋ 新規案件登録」ボタンから登録してください。</p>
    </div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">新規案件登録</h2>
      <button id="closeModal" class="close-btn" aria-label="閉じる">×</button>
    </div>
    <form id="caseForm">
      <input type="hidden" id="caseId">

      <div class="form-grid">
        <div class="form-row col-company">
          <label for="company">会社<span class="required">*</span></label>
          <select id="company" required>
            <option value="TOHOシネマズ">TOHOシネマズ</option>
            <option value="109シネマズ">109シネマズ</option>
            <option value="ユナイテッドシネマ">ユナイテッドシネマ</option>
            <option value="佐々木興業">佐々木興業</option>
          </select>
        </div>

        <div class="form-row">
          <label for="receivedDate">受付日<span class="required">*</span></label>
          <input type="date" id="receivedDate" required>
        </div>

        <div class="form-row">
          <label for="theater">劇場名<span class="required">*</span></label>
          <input type="text" id="theater" list="theaterList" required placeholder="例：TOHOシネマズ 新宿">
          <datalist id="theaterList"></datalist>
        </div>

        <div class="form-row">
          <label for="tcPerson">TC担当者</label>
          <input type="text" id="tcPerson" list="tcPersonList" placeholder="履歴から選択 or 新規入力">
          <datalist id="tcPersonList"></datalist>
        </div>

        <div class="form-row">
          <label for="rPerson">R担当者</label>
          <input type="text" id="rPerson" list="rPersonList" placeholder="履歴から選択 or 新規入力">
          <datalist id="rPersonList"></datalist>
        </div>

        <div class="form-row">
          <label for="surveyDate">調査日</label>
          <input type="date" id="surveyDate">
        </div>

        <div class="form-row">
          <label for="quoteDate">見積り提出日</label>
          <input type="date" id="quoteDate">
        </div>

        <div class="form-row">
          <label for="category">種別</label>
          <select id="category">
            <option value="">選択してください</option>
            <option value="新規工事">新規工事</option>
            <option value="修理">修理</option>
            <option value="メンテナンス">メンテナンス</option>
            <option value="点検">点検</option>
            <option value="改修">改修</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-row">
          <label for="status">ステータス</label>
          <select id="status">
            <option value="受付">受付</option>
            <option value="調査中">調査中</option>
            <option value="見積り提出済">見積り提出済</option>
            <option value="作業中">作業中</option>
            <option value="完了">完了</option>
            <option value="保留">保留</option>
            <option value="請求済">請求済</option>
            <option value="入金済">入金済</option>
          </select>
        </div>

        <div class="form-row">
          <label for="workStartDate">作業開始日</label>
          <input type="date" id="workStartDate">
        </div>

        <div class="form-row">
          <label for="workEndDate">作業完了日</label>
          <input type="date" id="workEndDate">
        </div>

        <div class="form-row">
          <label for="invoiceDate">請求書発行日</label>
          <input type="date" id="invoiceDate">
        </div>

        <div class="form-row">
          <label for="paymentDate">入金日</label>
          <input type="date" id="paymentDate">
        </div>

        <div class="form-row form-row-wide">
          <label for="content">内容</label>
          <textarea id="content" rows="3" placeholder="案件の詳細を記入"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="cancelBtn">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
