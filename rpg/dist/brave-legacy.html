<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ブレイヴ・レガシー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root {
  --bg: #0b0d1a;
  --bg2: #11152b;
  --panel: #161b38;
  --line: #2b3265;
  --gold: #f8d038;
  --gold-d: #b8860b;
  --text: #e8ecff;
  --muted: #8a93b8;
  --red: #e0584a;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, #161c40 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--text);
  font-family: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%;
  box-sizing: border-box;
  display: flex; flex-direction: column;
  padding-inline: 16px;
  max-width: 1100px; margin: 0 auto;
}
#topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-block: 8px 6px;
}
#topbar h1 {
  margin: 0; font-size: 15px; font-weight: 400; letter-spacing: .06em; color: var(--gold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#topbar h1 small { color: var(--muted); font-size: 12px; margin-left: .6em; letter-spacing: .02em; }
.tb-btns { display: flex; gap: 6px; flex: none; }
.tb-btns button {
  font: inherit; font-size: 12px; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
}
.tb-btns button:hover { border-color: #4a55a0; }
.tb-btns button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.tb-btns button.off { color: var(--muted); }
.tb-btns svg { width: 14px; height: 14px; }
#help {
  font-size: 13px; line-height: 1.7; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 14px; margin-bottom: 8px;
}
#help h2 { margin: 0 0 4px; font-size: 13px; font-weight: 400; color: var(--gold); letter-spacing: .08em; }
#help ul { margin: 0; padding-left: 1.1em; }
#help kbd {
  font: inherit; font-size: 12px; background: var(--bg2); border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
}
#screen-wrap {
  flex: 1 1 auto; min-height: 120px;
  display: flex; align-items: center; justify-content: center;
}
#app.pad #screen-wrap { align-items: flex-start; padding-top: 6px; }
#screen {
  display: block;
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000;
  border-radius: 3px;
  box-shadow: 0 0 0 2px #262c58, 0 0 0 6px #0e1126, 0 18px 50px rgba(0, 0, 0, .65);
  outline: none; touch-action: none;
}
#controls {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding-block: 12px 14px;
  touch-action: none;
}
#dpad {
  position: relative; width: 148px; height: 148px; flex: none;
  touch-action: none;
}
#dpad::before, #dpad::after {
  content: ""; position: absolute; background: #1c2244; border: 1px solid #323a72;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .06), 0 4px 0 #090b18;
}
#dpad::before { left: 50px; top: 4px; width: 46px; height: 138px; border-radius: 8px; }
#dpad::after { top: 50px; left: 4px; height: 46px; width: 138px; border-radius: 8px; }
#dpad .arr { position: absolute; z-index: 1; width: 0; height: 0; border: 9px solid transparent; pointer-events: none; opacity: .75; }
#dpad .up { left: 64px; top: 16px; border-bottom: 13px solid var(--muted); border-top-width: 0; }
#dpad .down { left: 64px; bottom: 16px; border-top: 13px solid var(--muted); border-bottom-width: 0; }
#dpad .left { top: 64px; left: 16px; border-right: 13px solid var(--muted); border-left-width: 0; }
#dpad .right { top: 64px; right: 16px; border-left: 13px solid var(--muted); border-right-width: 0; }
#dpad[data-dir="up"] .up { border-bottom-color: var(--gold); opacity: 1; }
#dpad[data-dir="down"] .down { border-top-color: var(--gold); opacity: 1; }
#dpad[data-dir="left"] .left { border-right-color: var(--gold); opacity: 1; }
#dpad[data-dir="right"] .right { border-left-color: var(--gold); opacity: 1; }
#abtns { position: relative; width: 156px; height: 132px; flex: none; }
#abtns button {
  position: absolute; border-radius: 50%; font: inherit; font-size: 20px;
  display: flex; align-items: center; justify-content: center; flex-direction: column; line-height: 1;
  border: 1px solid; cursor: pointer; touch-action: none;
  box-shadow: 0 5px 0 #070812, inset 0 2px 0 rgba(255, 255, 255, .25);
}
#abtns button small { font-size: 10px; margin-top: 3px; opacity: .85; }
#abtns .a { right: 2px; top: 6px; width: 76px; height: 76px; background: linear-gradient(#f8d850, #d8a020); color: #2a1a00; border-color: #fff0a0; }
#abtns .b { left: 2px; bottom: 4px; width: 64px; height: 64px; background: linear-gradient(#3a4486, #262e62); color: var(--text); border-color: #5260b0; }
#abtns button.on { transform: translateY(3px); box-shadow: 0 2px 0 #070812, inset 0 2px 0 rgba(255, 255, 255, .15); filter: brightness(1.1); }
#keyhelp { flex: none; text-align: center; font-size: 12px; color: var(--muted); padding-block: 8px 10px; }
#keyhelp kbd { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; margin: 0 2px; }
#controls:not([hidden]) ~ #keyhelp { display: none; }
@media (max-width: 420px) {
  #topbar h1 small { display: none; }
  .tb-btns button .lbl { display: none; }
  #dpad { transform: scale(.92); transform-origin: left center; }
  #abtns { transform: scale(.92); transform-origin: right center; }
}
@media (prefers-reduced-motion: reduce) {
  #abtns button.on { transform: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>ブレイヴ・レガシー<small>第一章 はじまりの島</small></h1>
    <div class="tb-btns">
      <button id="btn-mute" type="button" aria-pressed="true" title="サウンド">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 6h3l4-3v10L5 10H2z"/><path fill="none" stroke="currentColor" stroke-width="1.4" d="M11 5.5c1 .8 1 4.2 0 5M12.8 3.8c2 1.7 2 6.7 0 8.4"/></svg>
        <span class="lbl">おと ON</span>
      </button>
      <button id="btn-pad" type="button" aria-pressed="false" title="タッチパッドの表示切替">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6 1h4v5h5v4h-5v5H6v-5H1V6h5z"/></svg>
        <span class="lbl">パッド</span>
      </button>
      <button id="btn-help" type="button" aria-expanded="false" title="あそびかた">？</button>
    </div>
  </header>
  <section id="help" hidden>
    <h2>あそびかた</h2>
    <ul>
      <li>いどう：<kbd>↑↓←→</kbd> / <kbd>WASD</kbd>　けってい・はなす・しらべる：<kbd>Z</kbd> / <kbd>Enter</kbd> / <kbd>Space</kbd></li>
      <li>キャンセル・コマンド：<kbd>X</kbd> / <kbd>Esc</kbd>　スマホは画面下のパッドで操作できます。</li>
      <li>まずは城の王様にあいさつし、町の酒場で仲間を集めましょう。夜は強い魔物が出ます。</li>
      <li>つぼ・たる・足もとを「しらべる」と「ほしのかけら」が見つかることも。セーブはメニューの「きろく」から。</li>
    </ul>
  </section>
  <div id="screen-wrap"><canvas id="screen" tabindex="0" aria-label="ゲーム画面"></canvas></div>
  <div id="controls" hidden>
    <div id="dpad" aria-label="方向パッド"><span class="arr up"></span><span class="arr down"></span><span class="arr left"></span><span class="arr right"></span></div>
    <div id="abtns">
      <button class="b" data-btn="b" type="button" aria-label="Bボタン">B<small>もどる</small></button>
      <button class="a" data-btn="a" type="button" aria-label="Aボタン">A<small>けってい</small></button>
    </div>
  </div>
  <div id="keyhelp"><kbd>↑↓←→</kbd>いどう　<kbd>Z</kbd>けってい／はなす　<kbd>X</kbd>メニュー／もどる</div>
</div>
<script>
/* ---- src/core.js ---- */
'use strict';
/* =====================================================================
 * core.js — engine foundation
 *   screen scaling / input (keyboard + touch pad) / scene stack /
 *   timers / fades / drawing helpers (DQ-style windows & text)
 * ===================================================================== */

const SW = 256, SH = 240, TS = 16;
const FONT = '"DotGothic16", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", monospace';
const COL = {
  white: '#f8f8f8', gray: '#98a0b0', dim: '#606878', black: '#000000',
  yellow: '#f8d838', orange: '#f89838', red: '#f05038', green: '#78e070',
  blue: '#78b8f8', outline: '#181018',
};

/* ---------- small utils ---------- */
const rnd = n => Math.floor(Math.random() * n);                 // 0..n-1
const rndInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
/* deterministic hash noise in [0,1) — used for tile art */
function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
const DIRS = ['down', 'up', 'left', 'right'];
const DXY = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] };
const OPP = { down: 'up', up: 'down', left: 'right', right: 'left' };

/* ---------- screen ---------- */
const Screen = {
  canvas: null, ctx: null, px: 3,
  init() {
    this.canvas = document.getElementById('screen');
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    this.fit();
    window.addEventListener('resize', () => this.fit());
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.fit());
  },
  fit() {
    const wrap = this.canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const aw = Math.max(64, wrap.clientWidth), ah = Math.max(60, wrap.clientHeight);
    const css = Math.min(aw / SW, ah / SH);          // css px per game px
    const phys = css * dpr;                           // physical px per game px
    let px, cssScale;
    if (phys >= 1 && phys - Math.floor(phys) < 0.2) { px = Math.floor(phys); cssScale = px / dpr; }
    else { px = Math.max(1, Math.ceil(phys)); cssScale = css; }
    px = Math.min(px, 8);
    this.px = px;
    if (this.canvas.width !== SW * px) { this.canvas.width = SW * px; this.canvas.height = SH * px; }
    this.canvas.style.width = Math.floor(SW * cssScale) + 'px';
    this.canvas.style.height = Math.floor(SH * cssScale) + 'px';
  },
};
let ctx = null;   // set in Engine.start (shortcut to Screen.ctx)

/* ---------- input ---------- */
const Input = (() => {
  const held = Object.create(null), edge = Object.create(null), frames = Object.create(null);
  const KEYS = {
    ArrowUp: 'up', KeyW: 'up', Numpad8: 'up',
    ArrowDown: 'down', KeyS: 'down', Numpad2: 'down',
    ArrowLeft: 'left', KeyA: 'left', Numpad4: 'left',
    ArrowRight: 'right', KeyD: 'right', Numpad6: 'right',
    KeyZ: 'a', Enter: 'a', Space: 'a', NumpadEnter: 'a', KeyJ: 'a',
    KeyX: 'b', Escape: 'b', Backspace: 'b', KeyK: 'b', KeyC: 'b',
  };
  let lastDir = null;
  const listeners = [];
  function press(b) {
    if (!held[b]) { held[b] = true; edge[b] = true; frames[b] = 0; if (DXY[b]) lastDir = b; }
    for (const f of listeners) f(b);
  }
  function release(b) { held[b] = false; }
  function releaseAll() { for (const k in held) held[k] = false; }
  window.addEventListener('keydown', e => {
    const b = KEYS[e.code];
    if (!b) return;
    e.preventDefault();
    if (!e.repeat) press(b);
  });
  window.addEventListener('keyup', e => { const b = KEYS[e.code]; if (b) { e.preventDefault(); release(b); } });
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  return {
    held: b => !!held[b],
    pressed: b => !!edge[b],
    /* edge, or auto-repeat while held (menus) */
    repeat: b => !!edge[b] || (!!held[b] && frames[b] >= 18 && (frames[b] - 18) % 5 === 0),
    dir() {
      if (lastDir && held[lastDir]) return lastDir;
      for (const d of DIRS) if (held[d]) return d;
      return null;
    },
    consume(b) { edge[b] = false; },
    clearEdges() { for (const k in edge) edge[k] = false; },
    endFrame() {
      for (const k in edge) edge[k] = false;
      for (const k in held) if (held[k]) frames[k]++;
    },
    onPress(f) { listeners.push(f); },
    press, release, releaseAll,
  };
})();

/* on-screen touch pad (DOM) → Input */
const TouchPad = {
  init() {
    const pad = document.getElementById('dpad');
    if (pad) {
      let cur = null, pid = null;
      const setDir = d => {
        if (d === cur) return;
        if (cur) Input.release(cur);
        cur = d;
        if (d) Input.press(d);
        pad.dataset.dir = d || '';
      };
      const calc = e => {
        const r = pad.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        if (Math.hypot(dx, dy) < r.width * 0.12) return null;
        return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
      };
      pad.addEventListener('pointerdown', e => {
        e.preventDefault(); pid = e.pointerId;
        try { pad.setPointerCapture(pid); } catch (_) { /* ignore */ }
        setDir(calc(e));
      });
      pad.addEventListener('pointermove', e => { if (e.pointerId === pid) { e.preventDefault(); setDir(calc(e)); } });
      const end = e => { if (e.pointerId === pid) { pid = null; setDir(null); } };
      pad.addEventListener('pointerup', end);
      pad.addEventListener('pointercancel', end);
      pad.addEventListener('lostpointercapture', end);
    }
    document.querySelectorAll('[data-btn]').forEach(el => {
      const b = el.dataset.btn;
      let pid = null;
      el.addEventListener('pointerdown', e => {
        e.preventDefault(); pid = e.pointerId;
        try { el.setPointerCapture(pid); } catch (_) { /* ignore */ }
        el.classList.add('on'); Input.press(b);
      });
      const end = e => { if (e.pointerId === pid) { pid = null; el.classList.remove('on'); Input.release(b); } };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('lostpointercapture', end);
      el.addEventListener('contextmenu', e => e.preventDefault());
    });
  },
};

/* ---------- scene stack ---------- */
const Scenes = {
  list: [],
  push(s) { this.list.push(s); if (s.enter) s.enter(); return s; },
  remove(s) { const i = this.list.indexOf(s); if (i >= 0) { this.list.splice(i, 1); if (s.leave) s.leave(); } },
  top() { return this.list[this.list.length - 1]; },
  has(s) { return this.list.includes(s); },
  clear() { while (this.list.length) this.remove(this.list[this.list.length - 1]); },
  update() {
    for (const s of this.list) if (s.bgUpdate) s.bgUpdate();   // background animation
    // input goes to the topmost scene that handles updates (pure overlays are skipped)
    for (let i = this.list.length - 1; i >= 0; i--) { const s = this.list[i]; if (s.update) { s.update(); break; } }
  },
  render() {
    let start = 0;
    for (let i = this.list.length - 1; i >= 0; i--) if (this.list[i].opaque) { start = i; break; }
    for (let i = start; i < this.list.length; i++) { const s = this.list[i]; if (s.render && !s.hidden) s.render(); }
  },
};

/* ---------- timers & fades ---------- */
let frameCount = 0;
const Timers = {
  list: [],
  update() {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const t = this.list[i];
      if (--t.n <= 0) { this.list.splice(i, 1); t.res(); }
    }
  },
};
function wait(frames) { return new Promise(res => Timers.list.push({ n: Math.max(1, frames | 0), res })); }

const Fade = {
  a: 0, from: 0, to: 0, t: 0, dur: 0, color: '#000', res: null,
  get active() { return this.dur > 0; },
  update() {
    if (this.dur <= 0) return false;
    this.t++;
    this.a = this.from + (this.to - this.from) * Math.min(1, this.t / this.dur);
    if (this.t >= this.dur) { this.dur = 0; this.a = this.to; const r = this.res; this.res = null; if (r) r(); }
    return true;
  },
  render() {
    if (this.a <= 0) return;
    ctx.globalAlpha = Math.min(1, this.a);
    ctx.fillStyle = this.color;
    ctx.fillRect(0, 0, SW, SH);
    ctx.globalAlpha = 1;
  },
};
function fadeTo(a, frames = 18, color) {
  return new Promise(res => {
    if (color) Fade.color = color;
    if (Fade.res) { const r = Fade.res; Fade.res = null; r(); }
    Fade.from = Fade.a; Fade.to = a; Fade.t = 0; Fade.dur = Math.max(1, frames); Fade.res = res;
  });
}
const fadeOut = (f = 18, c = '#000') => fadeTo(1, f, c);
const fadeIn = (f = 18) => fadeTo(0, f);

/* screen shake / flash effects (battle etc.) */
const FX = {
  shake: 0, shakeMag: 0, flash: 0, flashColor: '#fff',
  doShake(frames = 12, mag = 3) { this.shake = frames; this.shakeMag = mag; },
  doFlash(frames = 6, color = '#fff') { this.flash = frames; this.flashColor = color; },
  update() { if (this.shake > 0) this.shake--; if (this.flash > 0) this.flash--; },
  offset() { return this.shake > 0 ? [(rnd(3) - 1) * this.shakeMag, (rnd(3) - 1) * this.shakeMag] : [0, 0]; },
  render() {
    if (this.flash > 0) {
      ctx.globalAlpha = Math.min(0.85, this.flash / 6);
      ctx.fillStyle = this.flashColor; ctx.fillRect(0, 0, SW, SH);
      ctx.globalAlpha = 1;
    }
  },
};

/* ---------- drawing helpers ---------- */
let _font = '';
function setFont(size) {
  const f = size + 'px ' + FONT;
  if (_font !== f) { ctx.font = f; _font = f; }
}
function drawText(str, x, y, color = COL.white, size = 12, align = 'left') {
  setFont(size);
  ctx.textBaseline = 'top';
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function textWidth(str, size = 12) { setFont(size); return ctx.measureText(str).width; }
function fillRect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }

/* DQ-style window: black body, 1px white border inset by 2 with cut corners */
function drawWindow(x, y, w, h, border = COL.white, title = null) {
  x |= 0; y |= 0; w |= 0; h |= 0;
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 1, y, w - 2, h);
  ctx.fillRect(x, y + 1, w, h - 2);
  ctx.fillStyle = border;
  ctx.fillRect(x + 3, y + 2, w - 6, 1);
  ctx.fillRect(x + 3, y + h - 3, w - 6, 1);
  ctx.fillRect(x + 2, y + 3, 1, h - 6);
  ctx.fillRect(x + w - 3, y + 3, 1, h - 6);
  if (title) {
    const tw = textWidth(title, 12);
    const tx = x + Math.floor((w - tw) / 2);
    ctx.fillStyle = '#000';
    ctx.fillRect(tx - 3, y, tw + 6, 5);
    drawText(title, tx, y - 4, border === COL.white ? COL.white : border, 12);
  }
}
/* ▶ cursor as pixel art (5x7) */
function drawCursor(x, y, color = COL.white) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 1, 7);
  ctx.fillRect(x + 1, y + 1, 1, 5);
  ctx.fillRect(x + 2, y + 2, 1, 3);
  ctx.fillRect(x + 3, y + 3, 1, 1);
}
/* ▼ page prompt */
function drawDownArrow(x, y, color = COL.white) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 7, 1);
  ctx.fillRect(x + 1, y + 1, 5, 1);
  ctx.fillRect(x + 2, y + 2, 3, 1);
  ctx.fillRect(x + 3, y + 3, 1, 1);
}
function drawSprite(img, x, y, flip = false) {
  if (!img) return;
  x = Math.round(x); y = Math.round(y);
  if (!flip) { ctx.drawImage(img, x, y); return; }
  ctx.save();
  ctx.translate(x + img.width, y);
  ctx.scale(-1, 1);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

/* word wrap for Japanese text written DQ-style (phrases separated by spaces).
 * returns an array of lines that fit in maxW. Lines of a 「speech」 paragraph
 * after the first get a one-character indent. */
const NO_HEAD = '、。，．！？」』）ー…っゃゅょァィゥェォッャュョ!?.,)';
function wrapText(str, maxW, size = 12) {
  const out = [];
  for (const para of String(str).split('\n')) {
    if (para === '') { out.push(''); continue; }
    const indent = para[0] === '「' ? '　' : '';
    let line = '';
    let first = true;
    const tokens = para.split(/(\s+)/).filter(t => t.length);
    const pushLine = () => { out.push((first ? '' : indent) + line.replace(/\s+$/, '')); line = ''; first = false; };
    for (let tok of tokens) {
      const avail = maxW - (first ? 0 : textWidth(indent, size));
      if (textWidth(line + tok, size) <= avail) { line += tok; continue; }
      if (/^\s+$/.test(tok)) { pushLine(); continue; }
      if (line.trim().length && textWidth(tok, size) <= avail) { pushLine(); line = tok; continue; }
      // break long token by characters
      for (const ch of tok) {
        const av = maxW - (first ? 0 : textWidth(indent, size));
        if (textWidth(line + ch, size) > av && line.length && !NO_HEAD.includes(ch)) pushLine();
        line += ch;
      }
    }
    if (line.length || first) pushLine();
  }
  return out;
}

/* ---------- storage (localStorage + optional claude db per-user saves) ---------- */
const LocalStore = {
  get(k) { try { const v = window.localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (_) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (_) { return false; } },
  del(k) { try { window.localStorage.removeItem(k); } catch (_) { /* ignore */ } },
};

const CloudStore = {
  db: null, uid: null, ready: false, chain: Promise.resolve(),
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.db = db; this.uid = uid; this.ready = true;
    } catch (_) { this.ready = false; }
  },
  ref(slot) { return this.db.doc('data/users/' + this.uid + '/save' + slot); },
  async load(slot) {
    if (!this.ready) return null;
    try { const s = await this.ref(slot).get(); return s.exists ? JSON.parse(s.data().json) : null; }
    catch (_) { return null; }
  },
  save(slot, data) {
    if (!this.ready) return Promise.resolve(false);
    const body = { json: JSON.stringify(data), at: Date.now() };
    this.chain = this.chain.then(() => this.ref(slot).set(body).then(() => true, () => false));
    return this.chain;
  },
  remove(slot) {
    if (!this.ready) return Promise.resolve();
    this.chain = this.chain.then(() => this.ref(slot).delete().catch(() => {}));
    return this.chain;
  },
};

/* ---------- main loop ---------- */
const Engine = {
  running: false, last: 0, acc: 0, onTick: null,
  start() {
    ctx = Screen.ctx;
    this.running = true;
    this.last = performance.now();
    const STEP = 1000 / 60;
    const frame = t => {
      this.acc += Math.min(120, t - this.last);
      this.last = t;
      let n = 0;
      while (this.acc >= STEP && n < 4) {
        this.tick();
        this.acc -= STEP; n++;
      }
      if (n >= 4) this.acc = 0;
      this.render();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  },
  tick() {
    frameCount++;
    Timers.update();
    FX.update();
    const fading = Fade.update();
    if (!fading) Scenes.update();
    if (this.onTick) this.onTick();
    Input.endFrame();
  },
  render() {
    const px = Screen.px;
    ctx.setTransform(px, 0, 0, px, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SW, SH);
    const [ox, oy] = FX.offset();
    if (ox || oy) ctx.translate(ox, oy);
    try { Scenes.render(); } catch (e) { console.error(e); }
    if (ox || oy) ctx.setTransform(px, 0, 0, px, 0, 0);
    FX.render();
    Fade.render();
  },
};

/*
 * audio.js - chiptune sound engine + original score (Web Audio API only, no audio files).
 * Exposes exactly one global: `Sound`.  All melodies here are original compositions.
 *
 *   Sound.unlock()             call from inside a user-gesture handler (pointerdown/keydown/click...)
 *   Sound.playBGM(name)        loop a BGM track (no-op if it is already the current track)
 *   Sound.stopBGM(fadeMs=300)
 *   Sound.currentBGM()         -> name | null   (the track that should be playing)
 *   Sound.playJingle(name)     -> Promise<void>; the BGM pauses and resumes where it was afterwards
 *   Sound.sfx(name)            one-shot effect, layered over the music
 *   Sound.setMuted(b) / Sound.isMuted()
 *   Sound.setVolume(v)         master volume 0..1 (default 0.5); Sound.getVolume()
 *   Sound.list()               -> { bgm: [...], jingles: [...], sfx: [...] }
 *
 * Integration notes
 *  - Nothing makes sound until unlock() has been called from a user gesture.  Calling it on
 *    every pointerdown/keydown is fine (cheap, idempotent).  After the first call the module
 *    also retries on pointerup/touchend/click/keydown, because mobile browsers only accept
 *    those as "activation" events and iOS may interrupt the context after calls/app switches.
 *  - Before unlock every call is a silent no-op, but playBGM() remembers the track and it
 *    starts on unlock.  If Web Audio is missing or fails, everything stays a silent no-op.
 *  - playBGM() during a jingle is deferred until the jingle ends (the jingle is not cut).
 *    After a jingle, the paused BGM resumes where it was unless playBGM/stopBGM was called
 *    meanwhile - including synchronously in the promise's .then().  For the battle victory
 *    fanfare call Sound.stopBGM(0) first, so battle music does not come back afterwards.
 *  - Muting suspends the AudioContext (saves battery); playJingle() resolves at once while
 *    muted.  The context is also suspended while the page is hidden.
 *  - Sound._debug holds test hooks (MML parser, per-track durations, offline rendering).
 */
const Sound = (() => {
  'use strict';

  // =====================================================================
  // Engine constants
  // =====================================================================
  const LOOKAHEAD = 0.2;      // seconds of music scheduled ahead of the audio clock
  const TICK_MS = 25;         // scheduler period
  const TPQ = 48;             // ticks per quarter note
  const WHOLE = TPQ * 4;      // ticks per whole note (192)
  const SWITCH_FADE = 0.15;   // BGM -> BGM fade-out (s)
  const JINGLE_FADE = 0.06;   // BGM fade-out before a jingle (s)
  const RESUME_FADE = 0.45;   // fade-in when a paused BGM resumes mid-song (s)
  const DEFAULT_VOLUME = 0.5;
  const MAX_SFX = 8;          // simultaneous sfx instances (oldest is cut)
  // Peak level of one full-volume voice before the master gain.
  const LVL = { pulse: 0.375, tri: 0.19, drum: 0.48, sfx: 1.1 };

  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const volCurve = (v) => (v <= 0 ? 0 : Math.pow(v, 1.6));

  // =====================================================================
  // Waveforms (built once per AudioContext)
  // =====================================================================
  const HARM = 96;

  // Wraps a PeriodicWave; `comp` scales it to a common loudness (browsers peak-normalise waves).
  function makeWave(c, re, im, targetRms) {
    const pw = c.createPeriodicWave(re, im);
    let ss = 0;
    for (let k = 1; k < re.length; k++) ss += re[k] * re[k] + im[k] * im[k];
    const rms = Math.sqrt(ss / 2);
    let pk = 1e-9;
    const N = 512;
    for (let i = 0; i < N; i++) {
      let y = 0;
      const x = (2 * Math.PI * i) / N;
      for (let k = 1; k < re.length; k++) y += re[k] * Math.cos(k * x) + im[k] * Math.sin(k * x);
      if (Math.abs(y) > pk) pk = Math.abs(y);
    }
    return { pw, comp: targetRms / (rms / pk) };
  }

  function pulseWave(c, duty, loud) {
    const re = new Float32Array(HARM + 1), im = new Float32Array(HARM + 1);
    for (let k = 1; k <= HARM; k++) {
      re[k] = Math.sin(2 * Math.PI * k * duty) / (Math.PI * k);
      im[k] = (1 - Math.cos(2 * Math.PI * k * duty)) / (Math.PI * k);
    }
    return makeWave(c, re, im, 0.5 * loud);
  }

  // 4-bit stepped triangle (32 steps, like the classic console bass channel).
  function triWave(c) {
    const M = 32, x = [];
    for (let i = 0; i < M; i++) x.push(i < 16 ? 15 - i : i - 16);
    const re = new Float32Array(65), im = new Float32Array(65);
    for (let n = 1; n <= 64; n++) {
      let xr = 0, xi = 0;
      for (let k = 0; k < M; k++) {
        const a = (-2 * Math.PI * n * k) / M;
        xr += x[k] * Math.cos(a);
        xi += x[k] * Math.sin(a);
      }
      const u = (Math.PI * n) / M;
      const s = Math.sin(u) / u;            // zero-order-hold sinc
      const hr = s * Math.cos(-u), hi = s * Math.sin(-u);
      const cr = (xr * hr - xi * hi) / M, ci = (xr * hi + xi * hr) / M;
      re[n] = 2 * cr;
      im[n] = -2 * ci;
    }
    const w = makeWave(c, re, im, 0.577);
    w.comp = 1;
    return w;
  }

  function noiseBuffer(c) {
    const n = Math.floor(c.sampleRate);
    const b = c.createBuffer(1, n, c.sampleRate);
    const d = b.getChannelData(0);
    let s = 0x2f6b1a53;
    for (let i = 0; i < n; i++) {
      s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
      d[i] = ((s >>> 0) / 4294967296) * 2 - 1;
    }
    return b;
  }

  const kits = new WeakMap();
  function getKit(c) {
    let k = kits.get(c);
    if (k) return k;
    k = {
      w: {
        p12: pulseWave(c, 0.125, 0.8),
        p25: pulseWave(c, 0.25, 0.9),
        p50: pulseWave(c, 0.5, 1.0),
        tri: triWave(c),
      },
      noise: noiseBuffer(c),
    };
    kits.set(c, k);
    return k;
  }
  const DUTY = ['p12', 'p25', 'p50', 'p25']; // @0..@3

  // =====================================================================
  // Envelopes, vibrato, note & drum voices
  // =====================================================================
  // [attack, sustain level, decay time-constant, release]
  const ENVS = [
    [0.004, 1.0, 0.0, 0.035],  // E0 organ / flat
    [0.006, 0.7, 0.12, 0.05],  // E1 brass: accent, then settle
    [0.003, 0.0, 0.3, 0.06],   // E2 pluck / harp
    [0.002, 0.0, 0.07, 0.02],  // E3 staccato blip
    [0.08, 1.0, 0.0, 0.15],    // E4 swell / pad
    [0.002, 0.0, 0.6, 0.3],    // E5 bell
    [0.02, 0.6, 0.25, 0.09],   // E6 soft lead
    [0.035, 0.85, 0.35, 0.12], // E7 strings
    [0.003, 0.35, 0.08, 0.04], // E8 punchy (fast decay to 35%)
    [0.003, 0.0, 0.14, 0.03],  // E9 short pluck (arpeggios)
  ];
  const VIB = [0, 10, 20, 35];  // V0..V3 depth in cents
  const VIB_RATE = 5.6, VIB_DELAY = 0.16;
  const vibCache = new Map();

  function setVibrato(param, at, dur, cents, det) {
    const key = cents + ':' + det + ':' + Math.round(dur * 50);
    let curve = vibCache.get(key);
    if (!curve) {
      const n = Math.max(4, Math.ceil(dur * 60));
      curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const t = (i / (n - 1)) * dur;
        const amt = t < VIB_DELAY ? 0 : Math.min(1, (t - VIB_DELAY) / 0.15);
        curve[i] = det + cents * amt * Math.sin(2 * Math.PI * VIB_RATE * (t - VIB_DELAY));
      }
      if (vibCache.size > 200) vibCache.clear();
      vibCache.set(key, curve);
    }
    try { param.setValueCurveAtTime(curve, at, dur); } catch (e) { param.value = det; }
  }

  function playTone(c, w, dest, freq, at, gate, peak, env, vib, det, reg) {
    const osc = c.createOscillator();
    osc.setPeriodicWave(w.pw);
    osc.frequency.value = freq;
    const A = Math.min(env[0], gate * 0.5), S = env[1], tc = env[2], R = env[3];
    const off = at + gate, end = off + R;
    if (vib && gate > 0.22) setVibrato(osc.detune, at, end - at, VIB[vib], det);
    else if (det) osc.detune.value = det;
    const g = c.createGain(), gp = g.gain;
    gp.setValueAtTime(0, at);
    gp.linearRampToValueAtTime(peak, at + A);
    let lvl = peak;
    if (S < 1 && tc > 0) {
      gp.setTargetAtTime(peak * S, at + A, tc);
      lvl = peak * (S + (1 - S) * Math.exp(-(gate - A) / tc));
    }
    gp.setValueAtTime(lvl, off);
    gp.linearRampToValueAtTime(0, end);
    osc.connect(g);
    g.connect(dest);
    osc.start(at);
    osc.stop(end + 0.01);
    reg(osc, g);
  }

  // Filtered-noise burst.  o: {type, f, f2, q, v, a, tc, d, rate}
  function noiseHit(c, k, dest, at, o, reg) {
    const src = c.createBufferSource();
    src.buffer = k.noise;
    src.loop = true;
    if (o.rate) src.playbackRate.value = o.rate;
    const f = c.createBiquadFilter();
    f.type = o.type || 'highpass';
    f.frequency.setValueAtTime(o.f, at);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, at + o.d);
    f.Q.value = o.q || 0.7;
    const g = c.createGain(), gp = g.gain, a = o.a || 0.001;
    gp.setValueAtTime(0, at);
    gp.linearRampToValueAtTime(o.v, at + a);
    gp.setTargetAtTime(0, at + a, o.tc);
    src.connect(f);
    f.connect(g);
    g.connect(dest);
    src.start(at, Math.random() * 0.8);
    src.stop(at + o.d);
    reg(src, g, f);
  }

  // Pitch-dropping triangle thump (kick, toms, timpani). o: {f, f2, sd, v, tc, d}
  function thump(c, k, dest, at, o, reg) {
    const osc = c.createOscillator();
    osc.setPeriodicWave(k.w.tri.pw);
    osc.frequency.setValueAtTime(o.f, at);
    osc.frequency.exponentialRampToValueAtTime(o.f2, at + o.sd);
    const g = c.createGain(), gp = g.gain;
    gp.setValueAtTime(0, at);
    gp.linearRampToValueAtTime(o.v, at + 0.002);
    gp.setTargetAtTime(0, at + 0.002, o.tc);
    osc.connect(g);
    g.connect(dest);
    osc.start(at);
    osc.stop(at + o.d);
    reg(osc, g);
  }

  // Drum kit for the noise channel (index = semitone of the MML note letter).
  const DRUMS = [
    (c, k, d, t, v, r) => { // 0 c: kick
      thump(c, k, d, t, { f: 170, f2: 46, sd: 0.07, v: v * 1.1, tc: 0.06, d: 0.28 }, r);
      noiseHit(c, k, d, t, { type: 'lowpass', f: 1500, v: v * 0.3, tc: 0.008, d: 0.04 }, r);
    },
    (c, k, d, t, v, r) => noiseHit(c, k, d, t, { type: 'bandpass', f: 2600, q: 2, v: v * 0.8, tc: 0.012, d: 0.06 }, r), // 1 c+: rim
    (c, k, d, t, v, r) => { // 2 d: snare
      noiseHit(c, k, d, t, { type: 'highpass', f: 900, v: v * 0.75, tc: 0.05, d: 0.24 }, r);
      thump(c, k, d, t, { f: 230, f2: 150, sd: 0.04, v: v * 0.45, tc: 0.03, d: 0.09 }, r);
    },
    (c, k, d, t, v, r) => noiseHit(c, k, d, t, { type: 'bandpass', f: 2000, q: 0.8, v: v * 0.55, tc: 0.06, d: 0.24 }, r), // 3 d+: soft snare
    (c, k, d, t, v, r) => noiseHit(c, k, d, t, { type: 'highpass', f: 7000, v: v * 0.5, tc: 0.014, d: 0.07 }, r), // 4 e: closed hat
    (c, k, d, t, v, r) => noiseHit(c, k, d, t, { type: 'highpass', f: 6000, v: v * 0.4, tc: 0.08, d: 0.4 }, r), // 5 f: open hat
    (c, k, d, t, v, r) => noiseHit(c, k, d, t, { type: 'bandpass', f: 5500, q: 1.2, v: v * 1.4, a: 0.01, tc: 0.022, d: 0.09 }, r), // 6 f+: shaker
    (c, k, d, t, v, r) => thump(c, k, d, t, { f: 150, f2: 85, sd: 0.12, v: v, tc: 0.09, d: 0.34 }, r), // 7 g: low tom
    (c, k, d, t, v, r) => thump(c, k, d, t, { f: 200, f2: 115, sd: 0.11, v: v, tc: 0.08, d: 0.3 }, r), // 8 g+: mid tom
    (c, k, d, t, v, r) => thump(c, k, d, t, { f: 270, f2: 150, sd: 0.1, v: v, tc: 0.07, d: 0.28 }, r), // 9 a: high tom
    (c, k, d, t, v, r) => thump(c, k, d, t, { f: 100, f2: 92, sd: 0.3, v: v, tc: 0.28, d: 1.1 }, r), // 10 a+: timpani
    (c, k, d, t, v, r) => noiseHit(c, k, d, t, { type: 'highpass', f: 3200, v: v * 0.5, tc: 0.35, d: 1.5 }, r), // 11 b: crash
  ];

  // =====================================================================
  // MML parser
  // ---------------------------------------------------------------------
  //  Notes     c d e f g a b, then + or # (sharp) / - (flat), length, dots:  c4  d+8.  e-16
  //  Rest      r8             Tie  ^8 (extends the previous note or rest:  c4^16)
  //  Octave    o4  > (up)  < (down)          Default length  l8   (l8. allowed)
  //  Volume    v0..v15        Gate  q1..q8 (sounding part in 8ths; q8 = legato)
  //  Timbre    @0..@3 pulse duty 12.5 / 25 / 50 / 75 %
  //  Envelope  E0..E9 (see ENVS)    Vibrato V0..V3    Detune D<cents>   Transpose k<semitones>
  //  Tempo     t<bpm> (quarter notes per minute; mirror tempo changes in every channel)
  //  Loops     [ ... ]n  - the part after an optional | is skipped on the last pass
  //  L         loop point: the track repeats from here (default: from the start)
  //  /         bar check: warns (debug) if it is not on a bar line
  //  Lengths   1 2 4 8 16 32 64, triplets 3 6 12 24 48 (whole note = 192 ticks)
  //  Noise channel: the note letter picks a drum (octave ignored):
  //    c kick, c+ rim, d snare, d+ soft snare, e closed hat, f open hat,
  //    f+ shaker, g low tom, g+ mid tom, a high tom, a+ timpani, b crash
  // =====================================================================
  const NOTE_SEMI = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
  const isDigit = (ch) => ch >= '0' && ch <= '9';

  function expandLoops(s, warn) {
    const re = /\[([^[\]]*)\](\d*)/;
    let guard = 0;
    while (s.indexOf('[') >= 0 && ++guard < 1000) {
      const m = re.exec(s);
      if (!m) { warn.push('unbalanced ['); s = s.replace(/[[\]]/g, ''); break; }
      const n = m[2] ? parseInt(m[2], 10) : 2;
      const cut = m[1].indexOf('|');
      const head = cut < 0 ? m[1] : m[1].slice(0, cut);
      const tail = cut < 0 ? '' : m[1].slice(cut + 1);
      let body = '';
      for (let k = 0; k < n; k++) body += head + (k < n - 1 ? tail : '');
      s = s.slice(0, m.index) + body + s.slice(m.index + m[0].length);
    }
    if (s.indexOf(']') >= 0) { warn.push('unbalanced ]'); s = s.replace(/\]/g, ''); }
    return s;
  }

  function parseMML(src, kind, bpm0, barTicks) {
    const warn = [];
    const s = expandLoops(String(src || '').replace(/\s+/g, ''), warn);
    const drum = kind === 'noise';
    const bar = barTicks || WHOLE;
    const ev = [];
    let i = 0, pos = 0, sec = 0, bars = 0;
    let oct = 4, dlen = TPQ, vol = 12, q = 7, duty = 1, env = kind === 'pulse' ? 1 : 0;
    let vib = 0, det = 0, tr = 0;
    let spt = 60 / ((bpm0 || 120) * TPQ);
    let last = null, lastRest = true, loopSec = null, loopTick = null;

    const int = (def) => {
      let j = i, sign = 1;
      if (s[j] === '-' || s[j] === '+') { sign = s[j] === '-' ? -1 : 1; j++; }
      let k = j;
      while (k < s.length && isDigit(s[k])) k++;
      if (k === j) return def;
      i = k;
      return sign * parseInt(s.slice(j, k), 10);
    };
    const length = () => {
      let k = i;
      while (k < s.length && isDigit(s[k])) k++;
      let t = dlen;
      if (k > i) {
        const n = parseInt(s.slice(i, k), 10);
        i = k;
        if (n > 0 && WHOLE % n === 0) t = WHOLE / n;
        else { warn.push('bad length ' + n); t = n > 0 ? Math.round(WHOLE / n) : dlen; }
      }
      let add = t;
      while (s[i] === '.') { add /= 2; t += add; i++; }
      if (t % 1) warn.push('fractional ticks near ' + i);
      return t;
    };
    const barCheck = () => {
      bars++;
      const r = pos % bar;
      if (r) warn.push(`bar ${bars}: off by ${r} ticks near "${s.slice(Math.max(0, i - 30), i)}"`);
    };

    while (i < s.length) {
      const ch = s[i++];
      if (NOTE_SEMI[ch] !== undefined) {
        let semi = NOTE_SEMI[ch];
        while (s[i] === '+' || s[i] === '#' || s[i] === '-') { semi += s[i] === '-' ? -1 : 1; i++; }
        const t = length(), d = t * spt;
        const m = drum ? ((semi % 12) + 12) % 12 : 12 * (oct + 1) + semi + tr;
        last = { t: sec, d, m, v: vol / 15, e: env, w: duty, q: q / 8, vib, det };
        ev.push(last);
        lastRest = false;
        pos += t; sec += d;
      } else if (ch === 'r') {
        const t = length();
        pos += t; sec += t * spt;
        lastRest = true;
      } else if (ch === '^') {
        while (s[i] === '/') { i++; barCheck(); }
        const t = length();
        if (last && !lastRest) last.d += t * spt;
        pos += t; sec += t * spt;
      } else if (ch === 'o') oct = int(oct);
      else if (ch === '>') oct++;
      else if (ch === '<') oct--;
      else if (ch === 'l') dlen = length();
      else if (ch === 'v') vol = clamp(int(vol), 0, 15);
      else if (ch === 'q') q = clamp(int(q), 1, 8);
      else if (ch === '@') duty = clamp(int(duty), 0, 3);
      else if (ch === 'E') env = clamp(int(env), 0, ENVS.length - 1);
      else if (ch === 'V') vib = clamp(int(vib), 0, VIB.length - 1);
      else if (ch === 'D') det = int(0);
      else if (ch === 'k') tr = int(0);
      else if (ch === 't') {
        let k = i;
        while (k < s.length && (isDigit(s[k]) || s[k] === '.')) k++;
        const b = parseFloat(s.slice(i, k));
        i = k;
        if (b > 0) spt = 60 / (b * TPQ); else warn.push('bad tempo');
      } else if (ch === 'L') {
        if (loopSec !== null) warn.push('duplicate L');
        loopSec = sec; loopTick = pos;
      } else if (ch === '/') barCheck();
      else warn.push(`unknown "${ch}" at ${i - 1}`);
    }
    return { ev, sec, ticks: pos, loopSec, loopTick, bars, warn };
  }

  // Compile a track definition: { tempo, bar?, loop?, kinds?, ch: [pulse1, pulse2, tri, noise] }
  function compileTrack(name, def) {
    const kinds = def.kinds || ['pulse', 'pulse', 'tri', 'noise'];
    const warn = [], chans = [];
    let len = 0, loopStart = null;
    def.ch.forEach((src, idx) => {
      if (!src) return;
      const kind = kinds[idx] || 'pulse';
      const r = parseMML(src, kind, def.tempo, def.bar);
      r.warn.forEach((w) => warn.push(`${name} ch${idx}: ${w}`));
      chans.push({ kind, ev: r.ev, len: r.sec, ticks: r.ticks, loopSec: r.loopSec, loopIdx: 0 });
      if (r.sec > len) len = r.sec;
      if (loopStart === null && r.loopSec !== null) loopStart = r.loopSec;
    });
    if (loopStart === null) loopStart = 0;
    const loopLen = len - loopStart;
    for (const ch of chans) ch.loopIdx = lowerBound(ch.ev, loopStart - 1e-6);
    return { name, loop: def.loop !== false && loopLen > 0.05, len, loopStart, loopLen, chans, warn };
  }

  function lowerBound(ev, t) {
    let lo = 0, hi = ev.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (ev[mid].t < t) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  // =====================================================================
  // Player: schedules one compiled track into an AudioContext (live or offline)
  // =====================================================================
  class Player {
    constructor(c, kit, dest, trk, opts) {
      this.c = c;
      this.kit = kit;
      this.trk = trk;
      this.done = false;
      this.alive = new Set();
      this.out = c.createGain();
      this.out.connect(dest);
      const when = opts.when, pos = clamp(opts.pos || 0, 0, trk.len);
      this.basis = when - pos;
      if (opts.fadeIn) {
        this.out.gain.setValueAtTime(0, when);
        this.out.gain.linearRampToValueAtTime(1, when + opts.fadeIn);
      }
      this.st = trk.chans.map((ch) => ({ ch, idx: lowerBound(ch.ev, pos - 1e-6), off: 0, fin: false }));
      this.reg = (src, ...nodes) => {
        this.alive.add(src);
        src.onended = () => {
          this.alive.delete(src);
          try { src.disconnect(); for (const n of nodes) n.disconnect(); } catch (e) { /* ignore */ }
        };
      };
    }

    nextAt(s) {
      const ev = s.ch.ev;
      if (s.fin || !ev.length) return Infinity;
      if (s.idx < ev.length) return this.basis + s.off + ev[s.idx].t;
      if (!this.trk.loop || s.ch.loopIdx >= ev.length) return Infinity;
      return this.basis + s.off + this.trk.loopLen + ev[s.ch.loopIdx].t;
    }

    // Schedule every event that starts before `horizon`.
    pump(now, horizon) {
      if (this.done) return;
      let next = Infinity;
      for (const s of this.st) next = Math.min(next, this.nextAt(s));
      if (next < now - 0.12) this.basis += now - next + 0.03; // main thread stalled: shift, don't drop
      let active = false;
      for (const s of this.st) {
        const ev = s.ch.ev;
        if (s.fin || !ev.length) continue;
        for (;;) {
          if (s.idx >= ev.length) {
            if (!this.trk.loop || s.ch.loopIdx >= ev.length) { s.fin = true; break; }
            s.idx = s.ch.loopIdx;
            s.off += this.trk.loopLen;
          }
          const e = ev[s.idx], at = this.basis + s.off + e.t;
          if (at >= horizon) break;
          if (at > now - 0.03) this.note(s.ch.kind, e, Math.max(at, now));
          s.idx++;
        }
        if (!s.fin) active = true;
      }
      if (!active) this.done = true;
    }

    note(kind, e, at) {
      const c = this.c, k = this.kit;
      if (kind === 'noise') {
        const fn = DRUMS[e.m];
        if (fn) fn(c, k, this.out, at, e.v * LVL.drum, this.reg);
        return;
      }
      const tri = kind === 'tri';
      const w = tri ? k.w.tri : k.w[DUTY[e.w]];
      const gate = Math.max(0.025, e.d * e.q);
      const peak = e.v * (tri ? LVL.tri : LVL.pulse) * w.comp;
      playTone(c, w, this.out, mtof(e.m), at, gate, peak, ENVS[e.e], e.vib, e.det, this.reg);
    }

    // Song position (s) at audio time `now`, folded into the loop.
    position(now) {
      let p = now - this.basis;
      const t = this.trk;
      if (t.loop && p >= t.len) p = t.loopStart + ((p - t.loopStart) % t.loopLen);
      return clamp(p, 0, t.len);
    }

    stopAt(t) {
      this.done = true;
      for (const s of this.alive) { try { s.stop(t); } catch (e) { /* ignore */ } }
      const out = this.out;
      const ms = Math.max(0, (t - this.c.currentTime) * 1000) + 120;
      setTimeout(() => { try { out.disconnect(); } catch (e) { /* ignore */ } }, ms);
    }

    fadeOut(now, sec) {
      const g = this.out.gain;
      sec = Math.max(0.005, sec);
      try {
        g.cancelScheduledValues(now);
        g.setValueAtTime(g.value, now);
        g.linearRampToValueAtTime(0, now + sec);
      } catch (e) { /* ignore */ }
      this.stopAt(now + sec + 0.01);
    }
  }

  // =====================================================================
  // Sound effects
  // =====================================================================
  function sfxEnv(gp, t, v, d, o) {
    const a = Math.min(o.a || 0.002, d * 0.5);
    gp.setValueAtTime(0, t);
    gp.linearRampToValueAtTime(v, t + a);
    const kind = o.env || 'decay';
    if (kind === 'hold') {
      const r = Math.min(o.r || 0.015, d - a);
      gp.setValueAtTime(v, t + d - r);
      gp.linearRampToValueAtTime(0, t + d);
    } else if (kind === 'lin') {
      gp.linearRampToValueAtTime(0, t + d);
    } else {
      const tc = Math.max(0.002, (d - a) / 4), tEnd = Math.max(t + a, t + d - 0.004);
      gp.setTargetAtTime(0, t + a, tc);
      gp.setValueAtTime(v * Math.exp(-(tEnd - t - a) / tc), tEnd);
      gp.linearRampToValueAtTime(0, t + d);
    }
  }

  const SFX_COMP = { sine: 0.7, sawtooth: 0.8, triangle: 0.85 };

  // Tiny synth toolkit handed to every sfx definition.
  function makeFx(c, k, out, reg) {
    const fx = {
      // o: {w, f, f2, f3, sd, lin, d, v, a, r, env, det, vr, vd}
      tone(t, o) {
        const osc = c.createOscillator(), w = k.w[o.w || 'p50'];
        if (w) osc.setPeriodicWave(w.pw); else osc.type = o.w;
        const fp = osc.frequency;
        fp.setValueAtTime(o.f, t);
        if (o.f2) {
          const te = t + (o.sd || o.d);
          if (o.lin) fp.linearRampToValueAtTime(o.f2, te); else fp.exponentialRampToValueAtTime(o.f2, te);
          if (o.f3) fp.exponentialRampToValueAtTime(o.f3, t + o.d);
        }
        if (o.det) osc.detune.value = o.det;
        const g = c.createGain();
        const comp = w ? w.comp : SFX_COMP[o.w] || 0.7;
        sfxEnv(g.gain, t, (o.v == null ? 0.6 : o.v) * LVL.sfx * comp, o.d, o);
        osc.connect(g);
        g.connect(out);
        if (o.vr) {
          const lfo = c.createOscillator(), lg = c.createGain();
          lfo.frequency.value = o.vr;
          lg.gain.value = o.vd || 20;
          lfo.connect(lg);
          lg.connect(fp);
          lfo.start(t);
          lfo.stop(t + o.d + 0.02);
          reg(lfo, lg);
        }
        osc.start(t);
        osc.stop(t + o.d + 0.02);
        reg(osc, g);
        return t + o.d;
      },
      // o: {type, f, f2, f3, sd, q, rate, rate2, d, v, a, r, env}
      noise(t, o) {
        const src = c.createBufferSource();
        src.buffer = k.noise;
        src.loop = true;
        if (o.rate) {
          src.playbackRate.setValueAtTime(o.rate, t);
          if (o.rate2) src.playbackRate.exponentialRampToValueAtTime(o.rate2, t + o.d);
        }
        const f = c.createBiquadFilter();
        f.type = o.type || 'lowpass';
        f.frequency.setValueAtTime(o.f || 3000, t);
        if (o.f2) {
          f.frequency.exponentialRampToValueAtTime(o.f2, t + (o.sd || o.d));
          if (o.f3) f.frequency.exponentialRampToValueAtTime(o.f3, t + o.d);
        }
        f.Q.value = o.q == null ? 0.7 : o.q;
        const g = c.createGain();
        sfxEnv(g.gain, t, (o.v == null ? 0.6 : o.v) * LVL.sfx, o.d, o);
        src.connect(f);
        f.connect(g);
        g.connect(out);
        src.start(t, Math.random() * 0.5);
        src.stop(t + o.d + 0.02);
        reg(src, g, f);
        return t + o.d;
      },
      // Plays MIDI notes `ms` every `step` seconds with tone options `o`.
      seq(t, ms, step, o) {
        let end = t;
        ms.forEach((m, i) => {
          if (m == null) return;
          end = Math.max(end, fx.tone(t + i * step, Object.assign({}, o, { f: mtof(m) })));
        });
        return end;
      },
    };
    return fx;
  }

  let textFlip = false;

  // Each definition schedules its sound at time t and returns the end time.
  const SFX = {
    cursor: (x, t) => x.tone(t, { w: 'p50', f: 1760, d: 0.035, v: 0.3, env: 'hold', r: 0.01 }),
    confirm: (x, t) => {
      x.tone(t, { w: 'p50', f: 1046.5, d: 0.045, v: 0.32, env: 'hold' });
      return x.tone(t + 0.05, { w: 'p50', f: 1568, d: 0.1, v: 0.32 });
    },
    cancel: (x, t) => {
      x.tone(t, { w: 'p50', f: 784, d: 0.045, v: 0.32, env: 'hold' });
      return x.tone(t + 0.05, { w: 'p50', f: 523.3, d: 0.09, v: 0.32 });
    },
    buzz: (x, t) => {
      for (const o of [0, 0.11]) {
        x.tone(t + o, { w: 'p50', f: 110, d: 0.08, v: 0.36, env: 'hold' });
        x.tone(t + o, { w: 'p25', f: 116.5, d: 0.08, v: 0.3, env: 'hold' });
      }
      return t + 0.19;
    },
    text: (x, t) => {
      textFlip = !textFlip;
      return x.tone(t, { w: 'p25', f: textFlip ? 1480 : 1319, d: 0.016, v: 0.13, env: 'hold', r: 0.006 });
    },
    hit: (x, t) => {
      x.noise(t, { type: 'lowpass', f: 5000, f2: 500, d: 0.13, v: 0.75 });
      return x.tone(t, { w: 'p50', f: 220, f2: 70, d: 0.1, v: 0.35 });
    },
    crit: (x, t) => {
      x.tone(t, { w: 'p25', f: 2637, d: 0.06, v: 0.3 });
      x.noise(t + 0.04, { type: 'lowpass', f: 7000, f2: 300, d: 0.3, v: 0.85 });
      x.tone(t + 0.04, { w: 'p50', f: 420, f2: 50, d: 0.26, v: 0.4 });
      return x.noise(t + 0.15, { type: 'lowpass', f: 3000, f2: 200, d: 0.22, v: 0.6 });
    },
    hurt: (x, t) => {
      x.noise(t, { type: 'lowpass', f: 4000, f2: 500, d: 0.3, v: 0.85, rate: 0.6 });
      return x.tone(t, { w: 'p50', f: 180, f2: 60, d: 0.18, v: 0.3 });
    },
    miss: (x, t) => x.noise(t, { type: 'bandpass', f: 500, f2: 3500, f3: 900, sd: 0.1, q: 2.5, d: 0.24, v: 0.6, a: 0.05 }),
    enemyDie: (x, t) => {
      x.noise(t, { type: 'lowpass', f: 2500, f2: 200, d: 0.45, v: 0.35, a: 0.02 });
      return x.tone(t, { w: 'p25', f: 1200, f2: 70, d: 0.45, v: 0.4, vr: 30, vd: 60 });
    },
    spell: (x, t) => {
      const up = [84, 88, 91, 96, 100, 103, 108];
      x.seq(t, up, 0.035, { w: 'p12', d: 0.09, v: 0.3 });
      x.seq(t + 0.07, up, 0.035, { w: 'p12', d: 0.09, v: 0.14 });
      return x.noise(t, { type: 'highpass', f: 8000, d: 0.36, v: 0.14, a: 0.1 });
    },
    fire: (x, t) => {
      x.noise(t, { type: 'bandpass', f: 400, f2: 2500, f3: 700, sd: 0.15, q: 1.2, d: 0.6, v: 0.85, a: 0.03 });
      x.tone(t, { w: 'p50', f: 110, f2: 55, d: 0.4, v: 0.16 });
      for (let i = 0; i < 6; i++) x.noise(t + 0.05 + Math.random() * 0.45, { type: 'highpass', f: 3000, d: 0.03, v: 0.4 });
      return t + 0.62;
    },
    ice: (x, t) => {
      x.noise(t, { type: 'highpass', f: 7000, d: 0.35, v: 0.22, a: 0.05 });
      return x.seq(t, [100, 96, 103, 98, 105], 0.06, { w: 'triangle', d: 0.18, v: 0.45 });
    },
    wind: (x, t) => {
      x.noise(t, { type: 'bandpass', f: 300, f2: 1800, f3: 500, sd: 0.35, q: 4, d: 0.8, v: 0.8, a: 0.15 });
      return x.noise(t + 0.1, { type: 'bandpass', f: 600, f2: 2400, f3: 800, sd: 0.3, q: 6, d: 0.7, v: 0.45, a: 0.12 });
    },
    heal: (x, t) => {
      const up = [72, 76, 79, 84, 88, 91];
      x.seq(t, up, 0.05, { w: 'p25', d: 0.12, v: 0.3 });
      x.seq(t + 0.09, up.map((m) => m + 12), 0.05, { w: 'p12', d: 0.1, v: 0.12 });
      return x.tone(t + 0.3, { w: 'p25', f: mtof(96), d: 0.35, v: 0.25 });
    },
    buff: (x, t) => {
      x.tone(t, { w: 'p25', f: 330, f2: 990, d: 0.18, v: 0.32, env: 'hold' });
      x.tone(t + 0.18, { w: 'p25', f: 440, f2: 1320, d: 0.2, v: 0.32, env: 'hold' });
      return x.tone(t + 0.38, { w: 'p25', f: 1320, d: 0.16, v: 0.25 });
    },
    debuff: (x, t) => {
      x.tone(t, { w: 'p25', f: 1100, f2: 280, d: 0.25, v: 0.32, vr: 18, vd: 40, env: 'hold' });
      return x.tone(t + 0.22, { w: 'p25', f: 900, f2: 200, d: 0.3, v: 0.3, vr: 18, vd: 30 });
    },
    sleep: (x, t) => x.seq(t, [79, 76, 72], 0.17, { w: 'triangle', d: 0.32, v: 0.55, vr: 5, vd: 6 }),
    poison: (x, t) => {
      [300, 240, 330, 200].forEach((f, i) => x.tone(t + i * 0.08, { w: 'p50', f, f2: f * 0.6, d: 0.07, v: 0.28 }));
      return x.noise(t, { type: 'lowpass', f: 800, d: 0.34, v: 0.18 });
    },
    stairs: (x, t) => {
      let end = t;
      [392, 330, 294, 247, 196].forEach((f, i) => {
        end = x.tone(t + i * 0.09, { w: 'triangle', f, f2: f * 0.7, d: 0.07, v: 0.6 });
      });
      return end;
    },
    door: (x, t) => {
      x.noise(t, { type: 'lowpass', f: 1200, d: 0.05, v: 0.5 });
      x.tone(t + 0.01, { w: 'p50', f: 150, f2: 210, lin: true, d: 0.12, v: 0.18, env: 'hold' });
      return x.tone(t + 0.13, { w: 'triangle', f: 120, f2: 70, d: 0.1, v: 0.6 });
    },
    locked: (x, t) => {
      x.tone(t, { w: 'triangle', f: 110, f2: 55, d: 0.12, v: 0.7 });
      x.noise(t, { type: 'lowpass', f: 400, d: 0.1, v: 0.5 });
      x.noise(t + 0.07, { type: 'bandpass', f: 2500, d: 0.025, v: 0.3 });
      return x.noise(t + 0.12, { type: 'bandpass', f: 2200, d: 0.025, v: 0.25 });
    },
    chest: (x, t) => {
      x.tone(t, { w: 'p25', f: 180, f2: 240, lin: true, d: 0.1, v: 0.16, env: 'hold' });
      x.seq(t + 0.08, [67, 72, 76, 79], 0.05, { w: 'p25', d: 0.1, v: 0.3 });
      return x.tone(t + 0.28, { w: 'p25', f: mtof(84), d: 0.28, v: 0.28 });
    },
    bump: (x, t) => {
      x.noise(t, { type: 'lowpass', f: 500, d: 0.04, v: 0.2 });
      return x.tone(t, { w: 'triangle', f: 95, f2: 55, d: 0.08, v: 0.38 });
    },
    run: (x, t) => {
      for (let i = 0; i < 7; i++) x.noise(t + i * 0.06, { type: 'bandpass', f: 1400, q: 1.5, d: 0.035, v: 0.5 - i * 0.04 });
      return x.noise(t + 0.4, { type: 'bandpass', f: 2000, f2: 600, d: 0.2, v: 0.3 });
    },
    encounter: (x, t) => {
      x.noise(t, { type: 'bandpass', f: 200, f2: 5000, q: 1.5, d: 0.5, v: 0.6, a: 0.3 });
      x.tone(t, { w: 'p12', f: 110, f2: 1760, d: 0.5, v: 0.25, a: 0.2 });
      return x.noise(t + 0.48, { type: 'highpass', f: 3000, d: 0.35, v: 0.45 });
    },
    explosion: (x, t) => {
      x.noise(t, { type: 'lowpass', f: 4000, f2: 120, d: 1.2, v: 0.9 });
      x.noise(t, { type: 'lowpass', f: 1500, f2: 100, d: 1.2, v: 0.7, rate: 0.35 });
      return x.tone(t, { w: 'sine', f: 110, f2: 30, d: 0.5, v: 0.9 });
    },
    warp: (x, t) => {
      x.tone(t, { w: 'p12', f: 200, f2: 1600, d: 0.6, v: 0.3, vr: 14, vd: 90, a: 0.05 });
      return x.tone(t + 0.05, { w: 'p25', f: 1600, f2: 200, d: 0.6, v: 0.2, vr: 11, vd: 70, a: 0.05 });
    },
    coin: (x, t) => {
      x.seq(t, [88, 92, 88, 92], 0.04, { w: 'p25', d: 0.036, v: 0.28, env: 'hold' });
      return x.tone(t + 0.16, { w: 'p25', f: mtof(96), d: 0.22, v: 0.28 });
    },
    step: (x, t) => x.noise(t, { type: 'lowpass', f: 900, d: 0.025, v: 0.14 }),
    swamp: (x, t) => {
      x.noise(t, { type: 'bandpass', f: 500, f2: 150, q: 2, d: 0.12, v: 0.5 });
      return x.tone(t, { w: 'p50', f: 140, f2: 70, d: 0.08, v: 0.18 });
    },
    equip: (x, t) => {
      x.noise(t, { type: 'highpass', f: 5000, d: 0.12, v: 0.35 });
      return x.seq(t, [100, 105], 0.025, { w: 'p12', d: 0.14, v: 0.26 });
    },
  };
  const SFX_GAP = { text: 30, step: 60, cursor: 25 }; // min ms between repeats (default 30)
  // Per-effect loudness trims (balanced against the music by offline measurement).
  const SFX_GAIN = {
    cursor: 3.4, confirm: 2.7, cancel: 2.4, buzz: 0.75, text: 2.5, hit: 2.5, crit: 1.2, hurt: 1.5,
    miss: 2.8, enemyDie: 1.9, spell: 1.1, fire: 0.95, ice: 0.8, wind: 1.7, heal: 1.15, buff: 1,
    debuff: 0.7, sleep: 0.7, poison: 1.6, stairs: 0.8, door: 0.8, locked: 2, chest: 1.25, bump: 1.75,
    run: 1.9, encounter: 0.9, explosion: 1.1, warp: 1.1, coin: 1.05, step: 5, swamp: 3.2, equip: 2.1,
  };

  // Schedules sfx `name` into context c at time `at`; returns the instance.
  function startSfx(c, k, dest, name, at) {
    const out = c.createGain();
    out.gain.value = SFX_GAIN[name] || 1;
    out.connect(dest);
    const srcs = new Set();
    const reg = (src, ...nodes) => {
      srcs.add(src);
      src.onended = () => {
        srcs.delete(src);
        try { src.disconnect(); for (const n of nodes) n.disconnect(); } catch (e) { /* ignore */ }
        if (!srcs.size) { try { out.disconnect(); } catch (e) { /* ignore */ } }
      };
    };
    const end = SFX[name](makeFx(c, k, out, reg), at) || at + 0.5;
    return { out, srcs, end };
  }

  // =====================================================================
  // Score - every track below is an original composition.
  // Channels: [pulse 1, pulse 2, triangle bass, noise drums]
  // =====================================================================
  const BGM = {};

      return new Mask(this.w, this.h, this.a.slice());
    }
    or(...ms) {
      const r = this.clone();
      for (const m of ms) for (let i = 0; i < r.a.length; i++) r.a[i] |= m.a[i];
      return r;
    }
    and(m) {
      const r = this.clone();
      for (let i = 0; i < r.a.length; i++) r.a[i] &= m.a[i];
      return r;
    }
    minus(...ms) {
      const r = this.clone();
      for (const m of ms) for (let i = 0; i < r.a.length; i++) if (m.a[i]) r.a[i] = 0;
      return r;
    }
    filter(f) {
      const r = new Mask(this.w, this.h);
      this.each((x, y) => { if (f(x, y)) r.set(x, y); });
      return r;
    }
    shift(dx, dy) {
      const r = new Mask(this.w, this.h);
      this.each((x, y) => r.set(x + dx, y + dy));
      return r;
    }
    grow(n = 1, diag = false) {
      let r = this;
      for (let k = 0; k < n; k++) {
        const s = r.clone();
        r.each((x, y) => {
          s.set(x - 1, y); s.set(x + 1, y); s.set(x, y - 1); s.set(x, y + 1);
          if (diag) { s.set(x - 1, y - 1); s.set(x + 1, y - 1); s.set(x - 1, y + 1); s.set(x + 1, y + 1); }
        });
        r = s;
      }
      return r;
    }
    shrink(n = 1, diag = false) {
      let r = this;
      for (let k = 0; k < n; k++) {
        const s = new Mask(this.w, this.h);
        r.each((x, y) => {
          let ok = r.has(x - 1, y) && r.has(x + 1, y) && r.has(x, y - 1) && r.has(x, y + 1);
          if (ok && diag) ok = r.has(x - 1, y - 1) && r.has(x + 1, y - 1) && r.has(x - 1, y + 1) && r.has(x + 1, y + 1);
          if (ok) s.set(x, y);
        });
        r = s;
      }
      return r;
    }
    // Pixels of this mask that touch the outside (4-neighbourhood).
    border() {
      return this.minus(this.shrink(1));
    }
    // Ring of pixels just outside this mask.
    ring(diag = false) {
      return this.grow(1, diag).minus(this);
    }
    // Erode by a disc of radius r (sampled at pixel centres); off-canvas counts as outside.
    erodeD(r) {
      const out = this.clone(), ri = Math.ceil(r);
      this.each((x, y) => {
        for (let j = -ri; j <= ri; j++)
          for (let i = -ri; i <= ri; i++)
            if (i * i + j * j <= r * r && !this.has(x + i, y + j)) { out.set(x, y, 0); return; }
      });
      return out;
    }
    flipX() {
      const r = new Mask(this.w, this.h);
      this.each((x, y) => r.set(this.w - 1 - x, y));
      return r;
    }
    sym() {
      return this.or(this.flipX());
    }
    each(f) {
      for (let y = 0; y < this.h; y++)
        for (let x = 0; x < this.w; x++) if (this.a[y * this.w + x]) f(x, y);
    }
    bbox() {
      let x0 = this.w, y0 = this.h, x1 = -1, y1 = -1;
      this.each((x, y) => {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      });
      return { x0, y0, x1, y1 };
    }
  }

  /* ================================================================== *
   *  Distance transform + light field (form shading)                   *
   * ================================================================== */

  // Exact Euclidean distance transform (Felzenszwalb & Huttenlocher): for
  // every pixel inside `m`, distance from its centre to the nearest pixel
  // centre outside `m` (the canvas border counts as outside).
  function edt(m) {
    const W = m.w + 2, H = m.h + 2, INF = 1e9;
    const g = new Float64Array(W * H);
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) g[y * W + x] = m.has(x - 1, y - 1) ? INF : 0;
    const n = Math.max(W, H);
    const f = new Float64Array(n), d = new Float64Array(n);
    const v = new Int32Array(n), z = new Float64Array(n + 1);
    const pass = (len) => {
      let k = 0;
      v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
      for (let q = 1; q < len; q++) {
        let s;
        for (;;) {
          const p = v[k];
          s = (f[q] + q * q - (f[p] + p * p)) / (2 * q - 2 * p);
          if (s > z[k]) break;
          k--;
        }
        k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
      }
      k = 0;
      for (let q = 0; q < len; q++) {
        while (z[k + 1] < q) k++;
        const p = v[k];
        d[q] = (q - p) * (q - p) + f[p];
      }
    };
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) f[y] = g[y * W + x];
      pass(H);
      for (let y = 0; y < H; y++) g[y * W + x] = d[y];
    }
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) f[x] = g[y * W + x];
      pass(W);
      for (let x = 0; x < W; x++) g[y * W + x] = d[x];
    }
    const out = new Float32Array(m.w * m.h);
    for (let y = 0; y < m.h; y++)
      for (let x = 0; x < m.w; x++) out[y * m.w + x] = Math.sqrt(g[(y + 1) * W + x + 1]);
    return out;
  }

  const LIGHT = (() => {
    const v = [-0.5, -0.72, 0.85];
    const l = Math.hypot(...v);
    return v.map((c) => c / l);
  })();

  // Default band thresholds per ramp length (ramp is ordered dark -> light).
  const THRESH = {
    1: [],
    2: [0.42],
    3: [0.28, 0.74],
    4: [0.1, 0.45, 0.84],
    5: [-0.05, 0.25, 0.58, 0.88],
    6: [-0.15, 0.1, 0.36, 0.64, 0.9],
  };

  const thresholds = (n) => THRESH[n] || Array.from({ length: n - 1 }, (_, i) => -0.15 + (1.05 * (i + 1)) / n);

  // Treat the mask as a height field (a rounded "pillow" whose rim falls off
  // over `o.round` pixels; default = full dome) and light it from the top-left.
  // Options: round, vg (extra top-to-bottom gradient), noise + seed (texture).
  // Returns a Float32Array of light values (about -0.8 .. 1) for mask pixels.
  function lightField(m, o = {}) {
    const { w, h } = m, n = w * h;
    const d = edt(m);
    let maxD = 0;
    for (let i = 0; i < n; i++) if (m.a[i] && d[i] > maxD) maxD = d[i];
    const R = Math.max(0.5, o.round ? Math.min(o.round, maxD - 0.5) : maxD - 0.5);
    const H0 = new Float32Array(n);
    for (let i = 0; i < n; i++)
      if (m.a[i]) {
        const t = Math.min((d[i] - 0.5) / R, 1);
        H0[i] = R * Math.sqrt(Math.max(0, 1 - (1 - t) * (1 - t)));
      }
    // one 3x3 box-blur pass smooths the discrete distance ridges
    const H = new Float32Array(n);
    const at0 = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : H0[y * w + x]);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        if (!m.a[y * w + x]) continue;
        let s = 0;
        for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) s += at0(x + i, y + j);
        H[y * w + x] = s / 9;
      }
    const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : H[y * w + x]);
    const bb = m.bbox();
    const bh = bb.y1 - bb.y0 + 1;
    const rand = o.noise ? rng(o.seed || 7) : null;
    const F = new Float32Array(n);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (!m.a[i]) continue;
        // Sobel gradient -> surface normal (-gx, -gy, 1) -> Lambert term
        const gx = (at(x + 1, y - 1) + 2 * at(x + 1, y) + at(x + 1, y + 1) - at(x - 1, y - 1) - 2 * at(x - 1, y) - at(x - 1, y + 1)) / 8;
        const gy = (at(x - 1, y + 1) + 2 * at(x, y + 1) + at(x + 1, y + 1) - at(x - 1, y - 1) - 2 * at(x, y - 1) - at(x + 1, y - 1)) / 8;
        let v = (-gx * LIGHT[0] - gy * LIGHT[1] + LIGHT[2]) / Math.hypot(gx, gy, 1);
        if (o.vg) v += o.vg * (0.5 - (y + 0.5 - bb.y0) / bh);
        if (rand) v += (rand() - 0.5) * o.noise;
        F[i] = v;
      }
    return F;
  }

  /* ================================================================== *
   *  Sprite: colour grid + shape builders + painting                   *
   * ================================================================== */
  class Sprite {
    constructor(w, h) {
      this.w = w;
      this.h = h;
      this.c = new Array(w * h).fill(null); // colour per pixel (null = clear)
      this.r = new Array(w * h).fill(null); // ramp the colour came from
      this.l = new Int8Array(w * h); // index within that ramp
    }

    /* ---------- shape builders (all return a Mask) ---------- */
    M() {
      return new Mask(this.w, this.h);
    }
    where(f) {
      const m = this.M();
      for (let y = 0; y < this.h; y++)
        for (let x = 0; x < this.w; x++) if (f(x, y, x + 0.5, y + 0.5)) m.a[y * this.w + x] = 1;
      return m;
    }
    // Ellipse centred (cx,cy) with radii rx,ry, optionally rotated (radians).
    ell(cx, cy, rx, ry = rx, rot = 0) {
      const c = Math.cos(rot), s = Math.sin(rot);
      return this.where((x, y, px, py) => {
        const dx = px - cx, dy = py - cy;
        const u = (dx * c + dy * s) / rx, v = (-dx * s + dy * c) / ry;
        return u * u + v * v <= 1;
      });
    }
    rect(x, y, w, h) {
      return this.where((px, py) => px >= x && py >= y && px < x + w && py < y + h);
    }
    // Filled polygon, flat [x0,y0,x1,y1,...] in pixel-edge coordinates.
    poly(pts) {
      const n = pts.length / 2;
      return this.where((x, y, px, py) => {
        let inside = false;
        for (let i = 0, j = n - 1; i < n; j = i++) {
          const xi = pts[2 * i], yi = pts[2 * i + 1], xj = pts[2 * j], yj = pts[2 * j + 1];
          if (yi > py !== yj > py && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
        }
        return inside;
      });
    }
    // Tapered capsule from (x0,y0) radius r0 to (x1,y1) radius r1.
    cap(x0, y0, x1, y1, r0, r1 = r0) {
      const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy || 1e-9;
      return this.where((x, y, px, py) => {
        const t = clamp(((px - x0) * dx + (py - y0) * dy) / L2, 0, 1);
        const qx = x0 + t * dx - px, qy = y0 + t * dy - py, r = r0 + (r1 - r0) * t;
        return qx * qx + qy * qy <= r * r;
      });
    }
    // Polyline of capsules with radius tapering r0 -> r1 along its length.
    path(pts, r0, r1 = r0) {
      const n = pts.length / 2;
      const seg = [];
      let total = 0;
      for (let i = 0; i < n - 1; i++) {
        const l = Math.hypot(pts[2 * i + 2] - pts[2 * i], pts[2 * i + 3] - pts[2 * i + 1]);
        seg.push(l);
        total += l;
      }
      let m = this.M(), acc = 0;
      for (let i = 0; i < n - 1; i++) {
        const ra = r0 + ((r1 - r0) * acc) / (total || 1);
        acc += seg[i];
        const rb = r0 + ((r1 - r0) * acc) / (total || 1);
        m = m.or(this.cap(pts[2 * i], pts[2 * i + 1], pts[2 * i + 2], pts[2 * i + 3], ra, rb));
      }
      return m;
    }
    // Quadratic / cubic Bezier stroke (3 or 4 control points, flat array).
    bez(pts, r0, r1 = r0, steps = 12) {
      const out = [];
      for (let k = 0; k <= steps; k++) {
        const t = k / steps, u = 1 - t;
        let x, y;
        if (pts.length === 6) {
          x = u * u * pts[0] + 2 * u * t * pts[2] + t * t * pts[4];
          y = u * u * pts[1] + 2 * u * t * pts[3] + t * t * pts[5];
        } else {
          x = u * u * u * pts[0] + 3 * u * u * t * pts[2] + 3 * u * t * t * pts[4] + t * t * t * pts[6];
          y = u * u * u * pts[1] + 3 * u * u * t * pts[3] + 3 * u * t * t * pts[5] + t * t * t * pts[7];
        }
        out.push(x, y);
      }
      return this.path(out, r0, r1);
    }
    // 1px Bresenham line between pixel coordinates (inclusive).
    seg(x0, y0, x1, y1) {
      const m = this.M();
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) {
        m.set(x0, y0);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
      return m;
    }
    // Polyline of 1px segments.
    segs(pts) {
      let m = this.M();
      for (let i = 0; i + 3 < pts.length; i += 2) m = m.or(this.seg(pts[i], pts[i + 1], pts[i + 2], pts[i + 3]));
      return m;
    }
    // Rounded pixel blob: w x h rectangle with its corner pixels knocked off.
    blob(x, y, w, h) {
      const m = this.rect(x, y, w, h);
      if (w >= 3 && h >= 3) m.set(x, y, 0).set(x + w - 1, y, 0).set(x, y + h - 1, 0).set(x + w - 1, y + h - 1, 0);
      return m;
    }
    pts(list) {
      const m = this.M();
      for (let i = 0; i + 1 < list.length; i += 2) m.set(list[i], list[i + 1]);
      return m;
    }

    /* ---------- painting ---------- */
    put(x, y, col, ramp = null, lvl = 0) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      const i = y * this.w + x;
      this.c[i] = col;
      this.r[i] = ramp;
      this.l[i] = lvl;
    }
    get(x, y) {
      return x < 0 || y < 0 || x >= this.w || y >= this.h ? null : this.c[y * this.w + x];
    }
    fill(m, col) {
      m.each((x, y) => this.put(x, y, col));
      return this;
    }
    // Paint a mask with a colour ramp (dark -> light) using form shading.
    // Options: line (separator colour drawn around the part over what is
    // already painted), field (reuse another part's light field), th (band
    // thresholds), shift (bias whole part darker/lighter by n tones), plus
    // the lightField options.
    shade(m, ramp, o = {}) {
      if (o.line) this.edge(m, o.line);
      const F = o.field || lightField(m, o);
      const th = o.th || thresholds(ramp.length);
      const sh = o.shift || 0;
      const { w, h } = this;
      const lv = new Int8Array(w * h).fill(-1);
      m.each((x, y) => {
        const i = y * w + x;
        let k = 0;
        while (k < th.length && F[i] >= th[k]) k++;
        lv[i] = clamp(k + sh, 0, ramp.length - 1);
      });
      // despeckle: a pixel whose tone matches none of its 4 neighbours joins the majority
      const src = lv.slice();
      m.each((x, y) => {
        const i = y * w + x, me = src[i];
        const nb = [];
        if (x > 0 && src[i - 1] >= 0) nb.push(src[i - 1]);
        if (x < w - 1 && src[i + 1] >= 0) nb.push(src[i + 1]);
        if (y > 0 && src[i - w] >= 0) nb.push(src[i - w]);
        if (y < h - 1 && src[i + w] >= 0) nb.push(src[i + w]);
        if (nb.length < 3 || nb.includes(me)) return;
        const cnt = {};
        let best = me, bc = 0;
        for (const k of nb) {
          cnt[k] = (cnt[k] || 0) + 1;
          if (cnt[k] > bc) { bc = cnt[k]; best = k; }
        }
        if (bc >= 2) lv[i] = best;
      });
      m.each((x, y) => {
        const i = y * w + x;
        this.put(x, y, ramp[lv[i]], ramp, lv[i]);
      });
      return F;
    }
    // Move already-painted pixels up/down their own ramp.
    tone(m, d) {
      m.each((x, y) => {
        const i = y * this.w + x;
        const r = this.r[i];
        if (!r) return;
        const k = clamp(this.l[i] + d, 0, r.length - 1);
        this.put(x, y, r[k], r, k);
      });
      return this;
    }
    // Opaque pixels as a mask.
    solid() {
      const m = this.M();
      for (let i = 0; i < this.c.length; i++) if (this.c[i]) m.a[i] = 1;
      return m;
    }
    // Draw a separating line around `m`, only over pixels already painted.
    edge(m, col, diag = false) {
      const s = this.solid();
      m.ring(diag).and(s).each((x, y) => this.put(x, y, col));
      return this;
    }
    // ASCII stamp: rows joined by '|', '.'/' ' = skip, map char -> colour (null = erase).
    stamp(x0, y0, art, map, flip = false) {
      const rows = art.split('|');
      rows.forEach((row, dy) => {
        for (let dx = 0; dx < row.length; dx++) {
          const ch = row[dx];
          if (ch === '.' || ch === ' ' || !(ch in map)) continue;
          const x = flip ? x0 + row.length - 1 - dx : x0 + dx;
          this.put(x, y0 + dy, map[ch]);
        }
      });
      return this;
    }
    // Final 1px silhouette outline (4-neighbour).
    outline(col = OUT) {
      const s = this.solid();
      s.ring(false).each((x, y) => this.put(x, y, col));
      return this;
    }
    // Copy into a canvas. Fully clear columns at the sides and rows at the
    // top are trimmed; the bottom row is kept so ground alignment (and a
    // flyer's float gap) is preserved.
    toCanvas() {
      const bb = this.solid().bbox();
      const x0 = bb.x1 < 0 ? 0 : bb.x0, x1 = bb.x1 < 0 ? this.w - 1 : bb.x1;
      const y0 = bb.y1 < 0 ? 0 : bb.y0;
      const w = x1 - x0 + 1, h = this.h - y0;
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext('2d');
      const img = ctx.createImageData(w, h);
      const cache = {};
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++) {
          const col = this.c[(y + y0) * this.w + x + x0];
          if (!col) continue;
          const rgb = cache[col] || (cache[col] = hexRgb(col));
          const i = (y * w + x) * 4;
          img.data[i] = rgb[0];
          img.data[i + 1] = rgb[1];
          img.data[i + 2] = rgb[2];
          img.data[i + 3] = 255;
        }
      ctx.putImageData(img, 0, 0);
      return cv;
    }
  }

  /* ================================================================== *
   *  Ramps (dark -> light)                                             *
   * ================================================================== */
  const R = {
    blue: ['#102468', '#1848b0', '#3878f8', '#60a0f8', '#90c0f8', '#d8ecff'],
    red: ['#581008', '#a82818', '#e84830', '#f87848', '#f8a878', '#fff0c8'],
    mud: ['#28280c', '#484818', '#6c6c28', '#8c8838', '#b0a858', '#e0d8a0'],
    gold: ['#784808', '#c08818', '#e8b020', '#f8d038', '#f8f0a0'],
    grey: ['#303040', '#505868', '#8890a0', '#c0c8d0', WH],
    cream: ['#a07850', '#d0a878', '#f0d8b0', '#f8f0e0'],
    pink: ['#801848', '#b82868', '#e04890', '#f890b8', '#f8c8e0'],
    brown: ['#482810', '#784820', '#b87838', '#e0a868'],
    green: ['#104820', '#207830', '#48b848', '#98e070'],
    purple: ['#301048', '#582888', '#9050c8', '#c090f0'],
  };

  /* ================================================================== *
   *  Monster designs                                                   *
   * ================================================================== */

  // ---- Jelly: low wobbly dome with drips ------------------------------
  function drawJelly(p) {
    const S = new Sprite(26, 20);
    const G = S.rect(0, 0, 26, 19); // everything above the ground row
    let body = S.where((x, y, px, py) =>
      Math.pow(Math.abs(px - 13) / 11.9, 2.3) + Math.pow(Math.abs(py - 10.9) / 8.3, 2.1) <= 1).and(G);
    body = body.or(S.rect(7, 17, 12, 2)); // flat base
    // drips sagging from the rounded lower edge, down to the ground
    const drips = S.cap(3.4, 12, 2, 16.2, 0.5, 1.15).or(S.cap(22.6, 12.4, 24, 16.4, 0.5, 1.1));
    body = body.or(drips).and(G);
    S.shade(body, p.ramp, { vg: 0.3, th: [-0.12, 0.2, 0.62, 0.95, 1.5] });
    // translucency: light glows through the lower belly
    S.tone(S.ell(12.5, 16.6, 6.5, 1.8).and(body.shrink(1)), +1);
    // droplet glints
    S.put(1, 15, p.ramp[4]);
    S.put(23, 15, p.ramp[4]);
    // glossy highlight on the upper left
    S.stamp(5, 5, '..ww|.w..|w...', { w: p.ramp[5] });
    S.stamp(6, 6, '.h|h.', { h: p.ramp[4] });
    S.put(9, 4, p.ramp[5]);
    // bubbles inside
    const bub = p.bubble || [p.ramp[3], p.ramp[4]];
    S.stamp(17, 12, 'hb|bb', { b: bub[0], h: bub[1] });
    S.put(20, 9, bub[1]);
    S.put(6, 13, bub[0]);
    S.put(14, 16, bub[0]);
    // face
    const E = { '#': OUT, w: WH };
    if (p.mood === 'grumpy') {
      S.stamp(7, 7, '##...|.###.|.#w#.|..#..', E);
      S.stamp(14, 7, '...##|.###.|.#w#.|..#..', E);
      S.stamp(11, 13, '.##.|#..#', E);
    } else {
      S.stamp(8, 7, '.#.|#w#|###|.#.', E);
      S.stamp(15, 7, '.#.|#w#|###|.#.', E);
      S.stamp(11, 12, '#.#.|.#.#', E);
    }
    S.outline();
    return S;
  }

  // ---- Star: plump five-pointed golden star ---------------------------
  function drawStar() {
    const S = new Sprite(26, 26);
    const cx = 13, cy = 14.2, Ri = 6.9, Ro = 12.9;
    const body = S.where((x, y, px, py) => {
      const dx = px - cx, dy = py - cy;
      const a = Math.atan2(dy, dx) + Math.PI / 2;
      const f = Math.pow((1 + Math.cos(5 * a)) / 2, 1.6);
      return Math.hypot(dx, dy) <= Ri + (Ro - Ri) * f;
    }).and(S.rect(1, 1, 24, 24));
    S.shade(body, R.gold, { th: [0.0, 0.38, 0.72, 0.93] });
    // sly face: lazy half-lids, pupils glancing aside, lopsided smirk
    const E = { '#': OUT, p: '#f89080' };
    S.stamp(8, 12, '####|..##', E);
    S.stamp(15, 12, '####|..##', E);
    S.stamp(11, 16, '#...#|.###.', E);
    S.put(16, 15, OUT);
    S.stamp(7, 15, 'pp', E);
    S.stamp(18, 15, 'pp', E);
    S.outline();
    // sparkles around it (not outlined)
    const sp = { W: WH, y: '#f8f0a0' };
    S.stamp(1, 2, '.y.|yWy|.y.', sp);
    S.stamp(22, 20, '.y.|yWy|.y.', sp);
    S.put(22, 3, WH);
    S.put(2, 19, WH);
    return S;
  }

  // ---- Mushroom: sleepy toadstool --------------------------------------
  function drawMushroom(p) {
    const S = new Sprite(26, 30);
    const body = S.ell(13, 22, 7.2, 6.2).or(S.ell(13, 16.5, 5.2, 5));
    const feet = S.ell(9.3, 27.9, 2.4, 1.5).or(S.ell(16.7, 27.9, 2.4, 1.5));

    S.fill(S.ell(13, 12.2, 10, 1.4), '#a86850');
    // cap

    S.fill(spore, p.spore);

    return S;
