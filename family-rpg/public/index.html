<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05071a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="きずな">
<meta name="format-detection" content="telephone=no">
<title>きずなの紋章</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="field" aria-label="フィールド"></canvas>
  <div id="labels"></div>
  <div id="fx"></div>
  <div id="hud" hidden></div>
  <div id="battle" hidden></div>
  <div id="ui"></div>
  <div id="touch" hidden>
    <div id="stick"><div id="stick-knob"></div></div>
    <button id="btn-a" class="tbtn" aria-label="けってい・はなす">A</button>
    <button id="btn-b" class="tbtn" aria-label="メニュー・もどる">B</button>
  </div>
  <div id="toast"></div>
  <div id="curtain"></div>
</div>
<noscript>このゲームは JavaScript が ひつようです。</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
